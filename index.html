/* ==========================================================================
   MODUL 4: SPIELLOGIK (reiner Zustand – kein Zeichnen, kein DOM)
   --------------------------------------------------------------------------
   SCHWIERIGKEIT ANPASSEN: alles Wichtige steht in CONFIG.
   ========================================================================== */
const CONFIG = {
  shiftLength: 12,                // Reisende pro Schicht (danach Abrechnung)
  hearts: 3,                      // Herzen pro Durchlauf
  pointsPerTraveler: 3,           // Prüfpunkte pro Reisendem
  tierStarts: [1, 4, 7, 10, 13],  // ab Reisendem X gilt Stufe 1, 2, 3, 4, 5
  bossesPerShift: 2,              // korrupte Vorgesetzte pro Schicht ab Stufe 5
  scoreBase: 100,                 // Basis × Reisenden-Nummer
  scoreGut: 50,                   // Bonus: richtig ohne jede Prüfung
  scoreSaved: 5,                  // Bonus pro gespartem Prüfpunkt
  heartsOnShiftChange: 1,         // "Glas Tee" beim Schichtwechsel
  startHour: 6                    // Uhrzeit des ersten Reisenden
};
function tierFor(n) { let t = 1; CONFIG.tierStarts.forEach((s, i) => { if (n >= s) t = i + 1; }); return t; }
function hourFor(n) { return (CONFIG.startHour + (n - 1) * (12 / CONFIG.shiftLength)) % 24; }

/* ---------- Pools der vorgefertigten Reisenden (ungesehene zuerst) ---------- */
let PREMADE = [];
const Pools = {
  byTier: {},
  build() {
    let seen = Store.get("seen", []);
    if (!Array.isArray(seen)) seen = [];
    if (seen.length >= PREMADE.length - 6) { seen = []; Store.set("seen", seen); }   // fast alles gesehen → von vorn
    const S = new Set(seen);
    for (let tr = 1; tr <= 5; tr++) {
      const list = RNG.shuffle(PREMADE.filter(x => x.tier === tr));
      Pools.byTier[tr] = list.filter(x => !S.has(x.id)).concat(list.filter(x => S.has(x.id)));
    }
  },
  take(tier, pred) {
    const arr = Pools.byTier[tier] || [];
    const i = arr.findIndex(pred);
    return i < 0 ? null : arr.splice(i, 1)[0];
  },
  markSeen(id) {
    if (!id || id[0] !== "t") return;
    const seen = Store.get("seen", []);
    if (Array.isArray(seen) && !seen.includes(id)) { seen.push(id); Store.set("seen", seen); }
  }
};

/** Plant eine komplette Schicht: Mischung aus Akten und Generierung, gleiche Regeln. */
function buildLineup(startN) {
  const out = new Array(CONFIG.shiftLength);
  const tiers = []; for (let i = 0; i < CONFIG.shiftLength; i++) tiers.push(tierFor(startN + i));
  // Stufen 1–4: in Dreierblöcken mindestens ein Sauberer und ein Korrupter
  let i = 0;
  while (i < tiers.length) {
    const tr = tiers[i]; let j = i; while (j < tiers.length && tiers[j] === tr && j - i < 3) j++;
    const idx = []; for (let q = i; q < j; q++) idx.push(q);
    if (tr <= 4) {
      const chosen = [];
      const inn = Pools.take(tr, x => isInnocent(x.type)); if (inn) chosen.push(inn);
      const cor = Pools.take(tr, x => !isInnocent(x.type)); if (cor) chosen.push(cor);
      while (chosen.length < idx.length) { const any = Pools.take(tr, () => true); if (!any) break; chosen.push(any); }
      RNG.shuffle(chosen);
      idx.forEach((q, m) => { out[q] = chosen[m] || GEN.make(startN + q, tr); });
    }
    i = j;
  }
  // Stufe 5: feste Plätze für korrupte Vorgesetzte, Rest harte Fälle
  const t5 = []; tiers.forEach((tr, q) => { if (tr >= 5) t5.push(q); });
  if (t5.length) {
    const slots = RNG.shuffle(t5.slice(1)).slice(0, CONFIG.bossesPerShift);
    t5.forEach(q => {
      const n = startN + q;
      if (slots.includes(q)) out[q] = Pools.take(5, x => x.type === "boss") || GEN.make(n, 5, { type: "boss" });
      else out[q] = Pools.take(5, x => x.type !== "boss") || Pools.take(4, () => true) || Pools.take(3, () => true) || GEN.make(n, 5);
    });
  }
  return out;
}

const Game = {
  phase: "title",            // title | enter | inspect | resolve | exit | shiftEnd | gameOver
  hearts: CONFIG.hearts, score: 0, n: 0, shift: 1, points: CONFIG.pointsPerTraveler,
  used: {}, order: [], trav: null, result: null, lineup: [], stats: null, best: 0, newBest: false,

  freshStats() { return { decisions: 0, correct: 0, wrong: 0, caught: 0, let: 0, honestRej: 0, gut: 0 }; },

  /** Setzt ALLES zurück (außer Sprache): Herzen, Punkte, Prüfpunkte, Index, Timer, Partikel, Tasten. */
  newRun() {
    RNG = makeRng((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    GEN.count = 0;
    Game.hearts = CONFIG.hearts; Game.score = 0; Game.n = 0; Game.shift = 1;
    Game.points = CONFIG.pointsPerTraveler; Game.used = {}; Game.order = []; Game.trav = null; Game.result = null;
    Game.stats = Game.freshStats(); Game.newBest = false;
    Pools.build();
    Game.lineup = buildLineup(1);
    View.reset();
    Input.clearHeld();
  },
  start() { Game.newRun(); UI.closeOverlay(true); Game.nextTraveler(); },
  restart() { Game.start(); },

  nextTraveler() {
    Game.n++;
    const idx = (Game.n - 1) % CONFIG.shiftLength;
    Game.trav = Game.lineup[idx] || GEN.make(Game.n, tierFor(Game.n));
    Game.points = CONFIG.pointsPerTraveler; Game.used = {}; Game.order = []; Game.result = null;
    Game.phase = "enter";
    View.travelerEnter(Game.trav, Game.n);
    UI.onNewTraveler();
  },
  /** Vom Rendering gemeldet: Reisender steht an der Schranke. */
  onArrived() { if (Game.phase !== "enter") return; Game.phase = "inspect"; UI.update(); },

  canAct() { return Game.phase === "enter" || Game.phase === "inspect"; },
  ensureInspect() { if (Game.phase === "enter") View.skipEnter(); return Game.phase === "inspect"; },

  useTool(tool) {
    if (!Game.canAct() || UI.overlay) return;
    if (!Game.ensureInspect()) return;
    if (Game.used[tool]) { UI.toast("toast.used"); return; }
    if (Game.points <= 0) { UI.toast("toast.noPoints"); return; }
    Game.points--; Game.used[tool] = true; Game.order.push(tool);
    const v = Game.trav.f[tool].v;
    View.fxFinding(v);
    UI.onFinding(tool);
  },

  decide(accept) {
    if (!Game.canAct() || UI.overlay) return;
    if (!Game.ensureInspect()) return;
    const tv = Game.trav, innocent = isInnocent(tv.type), correct = accept === innocent;
    const usedCount = Game.order.length;
    const r = { accept, correct, base: 0, gut: 0, saved: 0, total: 0, lostHeart: false, savedN: Game.points };
    const s = Game.stats; s.decisions++;
    if (correct) {
      r.base = CONFIG.scoreBase * Game.n;
      r.gut = usedCount === 0 ? CONFIG.scoreGut : 0;
      r.saved = CONFIG.scoreSaved * Game.points;
      r.total = r.base + r.gut + r.saved;
      Game.score += r.total; s.correct++;
      if (!innocent) s.caught++;
      if (r.gut) s.gut++;
    } else {
      Game.hearts = Math.max(0, Game.hearts - 1); r.lostHeart = true; s.wrong++;
      if (innocent) s.honestRej++; else s.let++;
    }
    Game.result = r; Game.phase = "resolve";
    Pools.markSeen(tv.id);
    View.fxDecision(r, tv);
    UI.onDecision();
  },

  /** "Weiter": Reisender geht ab, danach nächster oder Abrechnung. */
  advance() {
    if (Game.phase !== "resolve" || UI.overlay) return;
    Game.phase = "exit";
    View.travelerExit(Game.result.accept);
    UI.update();
  },
  onExited() {
    if (Game.phase !== "exit") return;
    if (Game.hearts <= 0) { Game.finish(); Game.phase = "gameOver"; UI.openOverlay("gameOver"); return; }
    if (Game.n % CONFIG.shiftLength === 0) { Game.finish(); Game.phase = "shiftEnd"; UI.openOverlay("shiftEnd"); return; }
    Game.nextTraveler();
  },
  finish() {
    Game.best = Store.get("best", 0) || 0;
    if (Game.score > Game.best) { Game.best = Game.score; Game.newBest = true; Store.set("best", Game.score); }
    UI.update();
  },
  continueShift() {
    if (Game.phase !== "shiftEnd") return;
    Game.shift++;
    const before = Game.hearts;
    Game.hearts = Math.min(CONFIG.hearts, Game.hearts + CONFIG.heartsOnShiftChange);
    Game.newBest = false;
    Game.lineup = buildLineup(Game.n + 1);
    View.teaRefill();
    UI.closeOverlay(true);
    if (Game.hearts > before) UI.toast("toast.tea");
    Game.nextTraveler();
  },

  /** Verdacht 0–100 aus den Befunden (nach der Entscheidung: die Wahrheit). */
  suspicion() {
    if (!Game.trav) return 50;
    if (Game.result) return isInnocent(Game.trav.type) ? 6 : 94;
    let s = 50;
    Game.order.forEach(tool => { const v = Game.trav.f[tool].v; s += v > 0 ? 40 : v < 0 ? -14 : 3; });
    return clamp(s, 4, 96);
  },
  rankKey() {
    const s = Game.stats, tot = s.correct + s.wrong;
    const acc = tot ? s.correct / tot : 0;
    return "rank." + (acc < .5 ? 0 : acc < .75 ? 1 : acc < .92 ? 2 : 3);
  },
  isNightShift() { return Game.shift % 2 === 0; }
};

/* ==========================================================================
   MODUL 5: DARSTELLUNG (Canvas)
   --------------------------------------------------------------------------
   View  = visueller Zustand (Animationen, Wetter, Effekte, Partikel)
   R     = Canvas, Caches, Layout, Zeichenfunktionen
   Die Welt wird in "Welt-Koordinaten" (LTR) gezeichnet; bei Arabisch wird die
   ganze Szene gespiegelt, damit Reisender und Sprechblase zur Leserichtung
   passen. Text wird nie gespiegelt (eigene Bildschirm-Ebene, Richtung pro Zeile).
   ========================================================================== */
const SIL = [24, 17, 13];
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixRGB(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
function rgbStr(c, a) { return a === undefined ? "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")" : "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + a + ")"; }
function E(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot || 0, 0, Math.PI * 2); }
const isArabic = s => /[؀-ۿݐ-ݿࢠ-ࣿ]/.test(s);

/* ---------- Tageszeit: Himmel und Tönung ---------- */
const SKY = [ // Stunde, oben, unten, Tönung, Tönungsstärke
  [0, "#060a1c", "#161b38", [10, 16, 48], .60], [4.6, "#0b1030", "#2b2648", [12, 18, 52], .54],
  [5.6, "#2a3466", "#c0705a", [60, 40, 70], .30], [6.6, "#5d86c2", "#f2b27a", [130, 70, 40], .12],
  [8, "#5b98d6", "#f3dcaa", [255, 230, 190], 0], [12, "#4b8fd9", "#f6ead0", [255, 240, 210], .05],
  [16, "#5a92cf", "#f4d7a0", [255, 220, 170], 0], [17.4, "#5a6fae", "#f6a25a", [150, 60, 20], .12],
  [18.4, "#3a3772", "#d8644a", [80, 30, 60], .30], [19.4, "#1a1b45", "#5a3355", [20, 20, 60], .46],
  [21, "#0a0e26", "#1b1d3a", [10, 16, 48], .58], [24, "#060a1c", "#161b38", [10, 16, 48], .60]
].map(k => ({ h: k[0], top: hex2rgb(k[1]), bot: hex2rgb(k[2]), tint: k[3], ta: k[4] }));
function skyAt(h) {
  h = ((h % 24) + 24) % 24;
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1].h <= h) i++;
  const a = SKY[i], b = SKY[i + 1], t = clamp((h - a.h) / (b.h - a.h), 0, 1);
  const night = clamp((Math.max(a.ta, b.ta) > .3 ? lerp(a.ta, b.ta, t) : 0) / .6, 0, 1);
  return { top: mixRGB(a.top, b.top, t), bot: mixRGB(a.bot, b.bot, t), tint: mixRGB(a.tint, b.tint, t), ta: lerp(a.ta, b.ta, t), night };
}

/* ---------- Qualitätsstufen (AUTO / HOCH / NIEDRIG) ---------- */
const Quality = {
  mode: "auto", level: 2, fps: 60, frames: 0, acc: 0, slow: 0, warm: 3,
  levels: [
    { dpr: 1, sand: 70, smoke: .45, shimmer: false, shadows: false, stars: 40, haze: false },
    { dpr: 1.5, sand: 160, smoke: .8, shimmer: false, shadows: true, stars: 80, haze: true },
    { dpr: 2, sand: 300, smoke: 1, shimmer: true, shadows: true, stars: 130, haze: true }
  ],
  get cfg() { return Quality.levels[Quality.level]; },
  init() {
    Quality.mode = Store.get("quality", "auto");
    if (!["auto", "high", "low"].includes(Quality.mode)) Quality.mode = "auto";
    Quality.applyMode(false);
  },
  applyMode(resize) {
    if (Quality.mode === "high") Quality.level = 2;
    else if (Quality.mode === "low") Quality.level = 0;
    else {   // AUTO: schwache Geräte erkennen
      const cores = navigator.hardwareConcurrency || 4, mem = navigator.deviceMemory || 4;
      Quality.level = (cores <= 4 || mem <= 3) ? 1 : 2; Quality.warm = 3; Quality.slow = 0;
    }
    if (resize) R.resize();
  },
  setMode(m) { Quality.mode = m; Store.set("quality", m); Quality.applyMode(true); },
  sample(dt) {
    Quality.frames++; Quality.acc += dt;
    if (Quality.acc >= 1) {
      Quality.fps = Quality.frames / Quality.acc; Quality.frames = 0; Quality.acc = 0;
      UI.showFps(Quality.fps);
      if (Quality.mode === "auto" && !document.hidden) {
        if (Quality.warm > 0) { Quality.warm--; return; }
        if (Quality.fps < 47) { if (++Quality.slow >= 2 && Quality.level > 0) { Quality.level--; Quality.slow = 0; Quality.warm = 3; R.resize(); } }
        else Quality.slow = 0;
      }
    }
  }
};

/* ---------- Partikel ---------- */
const FX = {
  list: [], sand: [], max: 700,
  spawn(p) { if (FX.list.length < FX.max) { p.life = 0; FX.list.push(p); } },
  clear() { FX.list.length = 0; FX.sand.length = 0; },
  update(dt) {
    const L_ = FX.list;
    for (let i = L_.length - 1; i >= 0; i--) {
      const p = L_[i]; p.life += dt;
      if (p.life >= p.max) { L_[i] = L_[L_.length - 1]; L_.pop(); continue; }
      p.vy += (p.g || 0) * dt; p.vx *= (1 - (p.drag || 0) * dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.grow) p.size += p.grow * dt;
    }
    const S = FX.sand, W = R.W;
    for (let i = S.length - 1; i >= 0; i--) {
      const s = S[i]; s.x += s.vx * dt; s.y += s.vy * dt + Math.sin(View.time * 3 + s.ph) * 12 * dt;
      if (s.x > W + 40) { S[i] = S[S.length - 1]; S.pop(); }
    }
  }
};

/* ---------- Visueller Zustand ---------- */
const View = {
  time: 0, clock: CONFIG.startHour, clockTarget: CONFIG.startHour, lastAtm: -1,
  trav: null, anim: { mode: "none", t: 0, dur: 1, from: null, to: null }, pose: null,
  expr: "neutral", exprT: 0, talkT: 0, blinkT: 2, blinkA: 0, look: { x: 0, y: 0, tx: 0, ty: 0, t: 1 },
  boom: 0, boomTarget: 0, weather: { sand: .25, target: .25 }, queueShift: 0, queueCount: 7,
  shake: 0, zoomT: -1, flash: { c: [255, 0, 0], a: 0 }, langFade: 0,
  bolts: [], pulses: [], stamp: null, floaters: [], stampSlam: 0,
  gen: { next: 5, cough: 0, puff: 0 }, neon: { b: 1, next: 4, flick: 0 },
  tea: 1, steamT: 0, fly: { st: "idle", t: 12, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0 },
  reduced: false,

  reset() {
    View.trav = null; View.anim = { mode: "none", t: 0, dur: 1 }; View.pose = null;
    View.clock = View.clockTarget = CONFIG.startHour; View.lastAtm = Math.floor(View.clock);
    View.expr = "neutral"; View.exprT = 0; View.talkT = 0;
    View.boom = View.boomTarget = 0; View.shake = 0; View.zoomT = -1; View.flash.a = 0;
    View.bolts = []; View.pulses = []; View.stamp = null; View.floaters = []; View.stampSlam = 0;
    View.gen = { next: 5, cough: 0, puff: 0 }; View.neon = { b: 1, next: 4, flick: 0 };
    View.tea = 1; View.queueShift = 0; View.weather = { sand: .2, target: .2 };
    View.fly = { st: "idle", t: 10, x: 0, y: 0, vx: 0, vy: 0, hx: 0, hy: 0 };
    FX.clear();
  },
  teaRefill() { View.tea = 1; },

  travelerEnter(tv, n) {
    const Lo = R.Lo;
    View.trav = tv; View.expr = tv.mood === "nervous" ? "worried" : "neutral"; View.exprT = 0; View.talkT = 0;
    View.stamp = null;
    View.anim = { mode: "enter", t: 0, dur: 1.55, from: { x: Lo.roadVX, y: Lo.queueY, s: .22 }, to: null };
    View.queueShift = 1;
    View.queueCount = Math.min(7, CONFIG.shiftLength - ((n - 1) % CONFIG.shiftLength) - 1);
    View.clockTarget = hourFor(n);
    // Wetter je Reisendem: nachmittags oft Sandsturm, nachts ruhiger

    let s = .12 + r.next() * .3;

    else if (h >= 19 || h < 5) s = .06 + r.next() * .25;
    View.weather.target = s;
  },
  skipEnter() {
    if (View.anim.mode === "enter") { View.anim.t = View.anim.dur; View.updateAnim(0); }
  },
  travelerExit(accept) {
    const Lo = R.Lo;
    View.stampSlam = 0;
    if (accept) { View.boomTarget = 1.32; View.anim = { mode: "exitA", t: -.35, dur: 1.35, from: { x: Lo.standX, y: Lo.standY, s: 1 }, to: { x: R.W * 1.28, y: Lo.standY + Lo.U * 6, s: 1.18 } }; }
    else { View.anim = { mode: "exitR", t: 0, dur: 1.75, from: { x: Lo.standX, y: Lo.standY, s: 1 }, to: { x: Lo.roadVX + R.W * .02, y: Lo.queueY - R.H * .005, s: .17 } }; }
  },
  onLayout() {   // Layout hat sich geändert (Größe, Sprache): stehende Figur neu ausrichten
    if (View.anim.mode === "idle" && View.pose) { View.pose.x = R.Lo.standX; View.pose.y = R.Lo.standY; }
  },
  onLangChange() { View.langFade = .45; },

  /* ---- Effekte, von der Logik ausgelöst ---- */
  headScreen() {
    const P = View.pose; if (!P || !View.trav) return { x: R.W / 2, y: R.H / 2 };
    const B = BODY[View.trav.look.p], k = R.Lo.U * P.s * B.scale;
    return { x: P.x, y: P.y - (68 + B.neck + 10 * B.head) * k };
  },
  chestPos() {
    const P = View.pose; if (!P || !View.trav) return { x: R.W / 2, y: R.H / 2 };
    const B = BODY[View.trav.look.p], k = R.Lo.U * P.s * B.scale;
    return { x: P.x, y: P.y - 50 * k };
  },
  fxFinding(v) {
    const hp = View.headScreen();
    if (v > 0) {
      View.bolt(hp.x, hp.y); View.setExpr("shock", 1.4);
    } else if (v < 0) {
      View.pulse(hp.x, hp.y + R.Lo.U * 20, [80, 230, 120], .7);
      for (let i = 0; i < 10; i++) FX.spawn({ k: "sparkle", x: hp.x + (Math.random() - .5) * R.Lo.U * 30, y: hp.y + R.Lo.U * 25, vx: (Math.random() - .5) * 30, vy: -40 - Math.random() * 50, max: 1, size: 2 });
    } else {
      for (let i = 0; i < 8; i++) FX.spawn({ k: "puff", x: hp.x + (Math.random() - .5) * R.Lo.U * 24, y: hp.y + R.Lo.U * 18, vx: (Math.random() - .5) * 40, vy: -10 - Math.random() * 20, max: 1.1, size: R.Lo.U * 1.5, grow: R.Lo.U * 4 });
    }
  },
  fxDecision(r, tv) {
    const cp = View.chestPos(), hp = View.headScreen();
    View.stamp = { key: r.accept ? "stamp.ok" : "stamp.no", col: r.accept ? [40, 150, 70] : [200, 40, 30], t: 0, x: cp.x, y: cp.y };
    View.stampSlam = .5;
    View.zoomT = 0;
    View.tea = Math.max(0, View.tea - .09);
    if (r.correct) {
      if (r.accept) { View.pulse(hp.x, hp.y + R.Lo.U * 25, [90, 240, 130], 1.2); View.pulse(hp.x, hp.y + R.Lo.U * 25, [90, 240, 130], 1.6, .25); View.setExpr("happy", 9); }
      else { View.bolt(hp.x, hp.y); View.setExpr(tv.type === "boss" ? "smug" : "angry", 9); }
      View.floater(() => "+" + I18N.num(r.total), [255, 220, 120]);
      if (r.gut) View.floater(() => t("float.gut") + " +" + r.gut, [140, 255, 170], .35);
    } else {
      View.shake = View.reduced ? 4 : 13; View.flash = { c: [220, 30, 20], a: View.reduced ? .2 : .42 };
      View.setExpr(r.accept ? "smug" : "sad", 9);
      View.floater(() => "−1 ♥", [255, 90, 80]);
    }
  },
  setExpr(e, d) { View.expr = e; View.exprT = d; },
  bolt(tx, ty) {
    const pts = []; let x = tx + (Math.random() - .5) * R.W * .3, y = -10; const steps = 11;
    for (let i = 0; i <= steps; i++) {
      const f = i / steps; const nx = lerp(x, tx, f) + (i < steps ? (Math.random() - .5) * R.W * .07 * (1 - f * .6) : 0);
      pts.push([nx, lerp(y, ty, f)]);
    }
    const br = [];
    for (let b = 0; b < 2; b++) {
      const s = pts[3 + b * 3]; const arr = [s]; let bx = s[0], by = s[1];
      for (let j = 0; j < 4; j++) { bx += (Math.random() - .5) * R.W * .08; by += R.H * .05; arr.push([bx, by]); }
      br.push(arr);
    }
    View.bolts.push({ pts, br, t: 0, dur: .5 });
    View.flash = { c: [255, 40, 30], a: View.reduced ? .15 : .32 };
    View.shake = Math.max(View.shake, View.reduced ? 2 : 6);
    for (let i = 0; i < 26; i++) { const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 240; FX.spawn({ k: "shard", x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, g: 380, max: .7 + Math.random() * .4, size: 1.6 + Math.random() * 1.6 }); }
  },
  pulse(x, y, col, dur, delay) { View.pulses.push({ x, y, col, t: -(delay || 0), dur }); },
  floater(text, col, delay) { const hp = View.headScreen(); View.floaters.push({ text, col, t: -(delay || 0), dur: 1.9, x: hp.x, y: hp.y - R.Lo.U * 6 }); },

  /* ---- Fester Zeitschritt ---- */
  update(dt) {
    View.time += dt;
    const Lo = R.Lo;
    // Uhr läuft vorwärts zur Zielzeit
    let diff = (View.clockTarget - View.clock + 24) % 24; if (diff > 20) diff = 0;
    View.clock = (View.clock + Math.min(diff, dt * 1.4)) % 24;
    if (Game.phase !== "title") {
      const hr = Math.floor(View.clock);
      if (hr !== View.lastAtm) { View.lastAtm = hr; if ([0, 3, 6, 9, 12, 15, 18, 21].includes(hr) && Game.n > 0) UI.toast("atm." + hr); }
    }
    // Wetter
    const w = View.weather; w.sand += (w.target - w.sand) * Math.min(1, dt * .6);
    View.updateAnim(dt);
    // Mimik
    if (View.exprT > 0) { View.exprT -= dt; if (View.exprT <= 0) View.expr = View.trav && View.trav.mood === "nervous" ? "worried" : "neutral"; }
    if (View.talkT > 0) View.talkT -= dt;
    View.blinkT -= dt; if (View.blinkT <= 0) { View.blinkA = .16; View.blinkT = 2 + Math.random() * 3.5; }
    if (View.blinkA > 0) View.blinkA -= dt;
    const lk = View.look; lk.t -= dt;
    const nerv = View.trav && View.trav.mood === "nervous";
    if (lk.t <= 0) { lk.t = nerv ? .4 + Math.random() * .7 : 1 + Math.random() * 2.5; lk.tx = View.talkT > 0 ? 0 : (Math.random() - .5) * 1.6; lk.ty = (Math.random() - .5) * .8; }
    lk.x += (lk.tx - lk.x) * Math.min(1, dt * 12); lk.y += (lk.ty - lk.y) * Math.min(1, dt * 12);
    // Schranke, Warteschlange
    View.boom += (View.boomTarget - View.boom) * Math.min(1, dt * 5);
    if (View.queueShift > 0) View.queueShift = Math.max(0, View.queueShift - dt * 1.1);
    // Generator & Neonröhre
    const g = View.gen; g.next -= dt;
    if (g.next <= 0) { g.cough = 1.4; g.next = 7 + Math.random() * 10; }
    if (g.cough > 0) {
      g.cough -= dt;
      View.neon.b = Math.random() < .45 ? .05 + Math.random() * .3 : .8 + Math.random() * .2;
      if (Math.random() < dt * 9 && Lo.exhaust) {
        for (let i = 0; i < 3; i++) FX.spawn({ k: "spark", x: Lo.exhaust.x, y: Lo.exhaust.y, vx: (Math.random() - .5) * 110, vy: -60 - Math.random() * 120, g: 300, max: .5 + Math.random() * .4, size: 1.3 });
        FX.spawn({ k: "smoke", dark: 1, x: Lo.exhaust.x, y: Lo.exhaust.y, vx: 10 + w.sand * 40, vy: -30 - Math.random() * 20, max: 2.4, size: Lo.U * 1.6, grow: Lo.U * 5, drag: .2 });
      }
    } else {
      const n = View.neon; n.next -= dt;
      if (n.next <= 0) { n.flick = .25 + Math.random() * .3; n.next = 4 + Math.random() * 9; }
      if (n.flick > 0) { n.flick -= dt; n.b = Math.random() < .5 ? .15 : 1; } else n.b = .94 + Math.sin(View.time * 50) * .03 + Math.random() * .03;
    }
    g.puff -= dt;
    if (g.puff <= 0 && Lo.exhaust) { g.puff = .28 / Quality.cfg.smoke; FX.spawn({ k: "smoke", x: Lo.exhaust.x, y: Lo.exhaust.y, vx: 8 + w.sand * 50, vy: -18 - Math.random() * 14, max: 3, size: Lo.U * 1.1, grow: Lo.U * 3.2, drag: .1 }); }
    // Sand
    const target = Quality.cfg.sand * w.sand;
    let spawnN = 0;
    while (FX.sand.length < target && spawnN < 8) {
      spawnN++;
      const near = Math.random() < .18;
      const sp = (220 + Math.random() * 420) * (.55 + w.sand) * (R.W / 900 + .4) * (near ? 1.6 : 1);
      FX.sand.push({ x: -30 - Math.random() * 80, y: Lo.horizon - R.H * .08 + Math.pow(Math.random(), .7) * (R.H - Lo.horizon + R.H * .08),
        vx: sp, vy: (Math.random() - .5) * 30, len: sp * (near ? .05 : .028), ph: Math.random() * 6, near });
    }
    // Tee-Dampf
    View.steamT -= dt;
    if (View.steamT <= 0 && View.tea > .12 && Lo.tea) { View.steamT = .35; FX.spawn({ k: "steam", x: Lo.tea.x + (Math.random() - .5) * Lo.U * 2, y: Lo.tea.y, vx: (Math.random() - .5) * 6 + w.sand * 10, vy: -10 - Math.random() * 8, max: 2.4, size: Lo.U * .9, grow: Lo.U * 1.8 }); }
    // Fliege
    View.updateFly(dt);
    FX.update(dt);
    // Effekt-Timer
    View.bolts = View.bolts.filter(b => (b.t += dt) < b.dur);
    View.pulses = View.pulses.filter(p => (p.t += dt) < p.dur);
    View.floaters = View.floaters.filter(f => (f.t += dt) < f.dur);
    if (View.stamp) View.stamp.t += dt;
    if (View.stampSlam > 0) View.stampSlam -= dt;
    View.shake *= Math.exp(-dt * 7); if (View.shake < .1) View.shake = 0;
    View.flash.a *= Math.exp(-dt * 4.5);
    if (View.langFade > 0) View.langFade = Math.max(0, View.langFade - dt * 1.5);
    if (View.zoomT >= 0) { View.zoomT += dt; if (View.zoomT > 1.3) View.zoomT = -1; }
  },
  updateAnim(dt) {
    const A = View.anim, Lo = R.Lo;
    if (!View.trav) { View.pose = null; return; }
    if (A.mode === "none") return;
    A.t += dt;
    const nerv = View.trav.mood === "nervous";
    let P = View.pose || { x: 0, y: 0, s: 1 };
    if (A.mode === "enter") {
      const to = { x: Lo.standX, y: Lo.standY, s: 1 };
      const f = clamp(A.t / A.dur, 0, 1), e = ease.io(f);
      P = { x: lerp(A.from.x, to.x, e), y: lerp(A.from.y, to.y, e), s: lerp(A.from.s, to.s, ease.in(f) * .5 + e * .5), facing: 1, alpha: clamp(f * 4, 0, 1), walk: f < 1 };
      if (f >= 1) { A.mode = "idle"; P.walk = false; View.talkT = Math.min(3.8, 1 + t(View.trav.k.say).length * .018); View.pose = P; P.t = View.time; Game.onArrived(); }
    } else if (A.mode === "idle") {
      P = { x: Lo.standX, y: Lo.standY, s: 1, facing: 1, alpha: 1, walk: false };
    } else if (A.mode === "exitA" || A.mode === "exitR") {
      const f = clamp(A.t / A.dur, 0, 1);
      const e = A.mode === "exitA" ? ease.in(f) : ease.io(f);
      P = { x: lerp(A.from.x, A.to.x, e), y: lerp(A.from.y, A.to.y, e), s: lerp(A.from.s, A.to.s, e), facing: A.mode === "exitR" && A.t > .12 ? -1 : 1,
            alpha: A.mode === "exitR" ? clamp((1 - f) * 4, 0, 1) : 1, walk: A.t > 0 };
      if (f >= 1) { A.mode = "none"; View.trav = null; View.pose = null; View.boomTarget = 0; View.stamp = null; Game.onExited(); return; }
    }
    P.t = View.time; P.jx = nerv && !P.walk ? (Math.random() - .5) * .5 : 0;
    View.pose = P;
  },
  updateFly(dt) {
    const F = View.fly, Lo = R.Lo; F.t -= dt;
    if (F.st === "idle") { if (F.t <= 0 && View.trav) { F.st = "fly"; F.t = 6 + Math.random() * 4; F.x = -20; F.y = R.H * .3; } return; }
    if (F.st === "fly") {
      const hp = View.headScreen();
      F.hx = hp.x + Math.sin(View.time * 1.3) * Lo.U * 18; F.hy = hp.y + Math.cos(View.time * 1.7) * Lo.U * 10;
      F.vx += ((F.hx - F.x) * 3 + (Math.random() - .5) * 900) * dt; F.vy += ((F.hy - F.y) * 3 + (Math.random() - .5) * 900) * dt;
      F.vx *= .96; F.vy *= .96; F.x += F.vx * dt; F.y += F.vy * dt;
      if (F.t <= 0) { F.st = "land"; F.t = 3 + Math.random() * 3; F.x = R.W * .62 + Math.random() * R.W * .1; F.y = Lo.counterTop - 1; }
    } else if (F.st === "land") { if (F.t <= 0) { F.st = "idle"; F.t = 14 + Math.random() * 20; } }
  }
};

/* ---------- Körperbau der Völker ---------- */
const BODY = {
  human: { scale: 1.0, bw: 1.0, head: 1.0, neck: 6 },
  gobold: { scale: .82, bw: .92, head: 1.32, neck: 4 },
  dwarf: { scale: .74, bw: 1.42, head: 1.12, neck: 1.5 },
  giant: { scale: 1.12, bw: 1.3, head: .92, neck: 5 }
};

/* ==========================================================================
   R: Canvas, Caches, Zeichnen
   ========================================================================== */
const R = {
  cv: null, ctx: null, W: 0, H: 0, dpr: 1, mirror: false, Lo: {}, stars: [], tint: [0, 0, 0], ta: 0, night: 0, cam: { sx: 0, sy: 0, z: 1, ax: 0, ay: 0 },
  init() {
    R.cv = document.getElementById("cv"); R.ctx = R.cv.getContext("2d");
    R.world = document.createElement("canvas"); R.wctx = R.world.getContext("2d");
    R.band = document.createElement("canvas"); R.bctx = R.band.getContext("2d");
    R.bg = document.createElement("canvas"); R.fg = document.createElement("canvas");
    const sr = makeRng(777); R.stars = []; for (let i = 0; i < 140; i++) R.stars.push([sr.next(), sr.next() * sr.next(), .5 + sr.next() * 1.3, sr.next() * 6]);
    R.resize();
  },
  resize() {
    const st = document.getElementById("stage"), rc = st.getBoundingClientRect();
    const W = Math.max(1, Math.round(rc.width)), H = Math.max(1, Math.round(rc.height));
    R.W = W; R.H = H; R.dpr = Math.min(window.devicePixelRatio || 1, Quality.cfg.dpr);
    const dw = Math.round(W * R.dpr), dh = Math.round(H * R.dpr);
    [R.cv, R.world, R.bg, R.fg].forEach(c => { c.width = dw; c.height = dh; });
    R.cv.style.width = W + "px"; R.cv.style.height = H + "px";
    R.layout(); R.buildCaches(); View.onLayout();
  },
  layout() {
    const W = R.W, H = R.H, Lo = R.Lo;
    Lo.horizon = H * .42; Lo.counterTop = H * .845; Lo.beamH = Math.max(18, H * .06);
    Lo.U = Math.min(H / 108, W / 62);
    Lo.standY = Lo.counterTop + Lo.U * 22;
    Lo.standX = UI.bubbleInStage ? W * .32 : W * .5;
    Lo.roadVX = W * .5; Lo.queueY = Lo.horizon + H * .078; Lo.fenceY = Lo.horizon + H * .052;
    Lo.boomPivot = { x: W * .93, y: H * .645 }; Lo.boomLen = W * .34;
    Lo.tubeY = Lo.beamH + H * .014; Lo.tubeX0 = W * .3; Lo.tubeX1 = W * .7;
    Lo.tea = { x: W * .87, y: Lo.counterTop - Lo.U * 9.5 };
    Lo.shY0 = Math.floor(Lo.horizon - H * .03); Lo.shY1 = Math.ceil(Lo.horizon + H * .17);
    R.band.width = Math.round(W * R.dpr); R.band.height = Math.max(1, Math.round((Lo.shY1 - Lo.shY0) * R.dpr));
    R.vig = null;
  },
  roadHalf(y) { const Lo = R.Lo; return lerp(R.W * .012, R.W * .62, clamp((y - Lo.horizon) / (R.H - Lo.horizon), 0, 1)); },

  /* ---- Statische Ebenen einmal pro Größe vorzeichnen ---- */
  buildCaches() {
    const d = R.dpr;
    [[R.bg, [R.drawFar, R.drawMid]], [R.fg, [R.drawFg]]].forEach(([cv, fns]) => {
      const c = cv.getContext("2d"); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.setTransform(d, 0, 0, d, 0, 0); fns.forEach(fn => fn(c));
    });
    // Vordergrund besteht nur aus Balken, Pfosten und Tresen → nur diese Streifen kopieren (spart Füllrate)
    const Lo = R.Lo, pw = Math.max(10, R.W * .028), top = Lo.tubeY + 6, bot = Lo.counterTop - Lo.U * 3;

  drawFar(c) {

  palm(c, x, y, h, col) {
    c.strokeStyle = col; c.fillStyle = col; c.lineWidth = Math.max(1.5, h * .07); c.lineCap = "round";

  /* ---- Kamera: Spiegelung (RTL), Wackeln, Zoom ---- */
  computeCamera() {
    const cam = R.cam;
    const a = View.shake ? (Math.random() - .5) * 2 * View.shake : 0, b = View.shake ? (Math.random() - .5) * 2 * View.shake : 0;
    cam.sx = a; cam.sy = b;
    let z = 1;
    if (View.zoomT >= 0) { const T = View.zoomT; const env = T < .15 ? T / .15 : T < .55 ? 1 : 1 - (T - .55) / .75; z = 1 + (View.reduced ? .025 : .07) * clamp(env, 0, 1); }
    if (View.shake) z = Math.max(z, 1 + View.shake / 220);
    cam.z = z;
    const hp = View.headScreen(); cam.ax = R.mirror ? R.W - hp.x : hp.x; cam.ay = hp.y;
  },
  applyCamera(c) {
    const cam = R.cam, d = R.dpr;
    c.setTransform(d, 0, 0, d, 0, 0);
    c.translate(cam.sx, cam.sy);
    if (cam.z !== 1) { c.translate(cam.ax, cam.ay); c.scale(cam.z, cam.z); c.translate(-cam.ax, -cam.ay); }
    if (R.mirror) { c.translate(R.W, 0); c.scale(-1, 1); }
  },
  toScreen(x, y) {
    const cam = R.cam; let sx = R.mirror ? R.W - x : x, sy = y;
    sx = cam.ax + (sx - cam.ax) * cam.z; sy = cam.ay + (sy - cam.ay) * cam.z;
    return { x: sx + cam.sx, y: sy + cam.sy };
  },

  /* ---- Hauptzeichnung pro Frame ---- */
  render() {
    const c = R.ctx, W = R.W, H = R.H, Lo = R.Lo, d = R.dpr;
    if (W < 2 || H < 2) return;
    R.mirror = I18N.dir() === "rtl";
    const sk = skyAt(View.clock); R.tint = sk.tint; R.ta = sk.ta; R.night = sk.night;
    R.computeCamera();
    // 1) Himmel
    R.applyCamera(c);
    const gs = c.createLinearGradient(0, 0, 0, Lo.horizon + H * .05);
    gs.addColorStop(0, rgbStr(sk.top)); gs.addColorStop(1, rgbStr(sk.bot));
    c.fillStyle = gs; c.fillRect(-60, -60, W + 120, Lo.horizon + H * .1 + 60);
    R.drawCelestial(c, sk);
    // 2) Welt (Hintergrund). Tagsüber direkt auf die Hauptebene; bei Dämmerung/Nacht auf eine
    //    eigene Ebene, die anschließend getönt wird (der Himmel bleibt dabei unberührt).
    const tinted = sk.ta > .005, w = tinted ? R.wctx : c;
    if (tinted) { w.setTransform(1, 0, 0, 1, 0, 0); w.globalCompositeOperation = "source-over"; w.clearRect(0, 0, R.world.width, R.world.height); }
    R.applyCamera(w);
    w.drawImage(R.bg, 0, 0, W, H);
    R.drawQueue(w, sk);
    if (Quality.cfg.haze) {   // Sanddunst am Horizont
      const ha = .08 + View.weather.sand * .5;
      const g = w.createLinearGradient(0, Lo.horizon - H * .1, 0, Lo.horizon + H * .14);
      g.addColorStop(0, "rgba(230,200,150,0)"); g.addColorStop(.5, "rgba(230,200,150," + ha + ")"); g.addColorStop(1, "rgba(230,200,150,0)");
      w.fillStyle = g; w.fillRect(0, Lo.horizon - H * .1, W, H * .24);
    }
    R.drawParticles(w, true);
    R.drawBoom(w);
    if (Quality.cfg.shimmer) R.shimmer(tinted ? R.world : R.cv, w);
    if (tinted) {
      w.setTransform(1, 0, 0, 1, 0, 0); w.globalCompositeOperation = "source-atop"; w.fillStyle = rgbStr(sk.tint, sk.ta); w.fillRect(0, 0, R.world.width, R.world.height); w.globalCompositeOperation = "source-over";
      c.setTransform(1, 0, 0, 1, 0, 0); c.drawImage(R.world, 0, 0);
    }
    // 3) Reisender + Vordergrund (vom Neonlicht beleuchtet → schwächer getönt)
    R.applyCamera(c);
    if (View.trav && View.pose) R.drawTraveler(c, View.trav, View.pose, sk);
    for (const q of R.fgRects) c.drawImage(R.fg, q[0] * d, q[1] * d, q[2] * d, q[3] * d, q[0], q[1], q[2], q[3]);
    if (sk.ta > .005) {
      c.fillStyle = rgbStr(sk.tint, sk.ta * .62);
      const pw = Math.max(10, W * .028);
      c.fillRect(0, 0, W, Lo.beamH); c.fillRect(0, Lo.beamH, pw, Lo.counterTop - Lo.beamH); c.fillRect(W - pw, Lo.beamH, pw, Lo.counterTop - Lo.beamH);
      c.fillRect(0, Lo.counterTop, W, H - Lo.counterTop + 2);
    }
    R.drawCounterItems(c, sk);
    R.drawNeon(c);
    // 4) Licht (additiv)
    R.drawLights(c, sk);
    // 5) Vordere Partikel und Effekte
    R.drawParticles(c, false);
    R.drawSand(c, sk);
    R.drawFly(c);
    R.drawFx(c);
    // 6) Bildschirm-Ebene: Dunst, Blitz, Vignette, Texte
    c.setTransform(d, 0, 0, d, 0, 0);
    const sa = View.weather.sand;
    if (sa > .25) { const sc = mixRGB([214, 176, 120], sk.tint, sk.ta); c.fillStyle = rgbStr(sc, (sa - .25) * .2); c.fillRect(0, 0, W, H); }
    if (View.flash.a > .01) { c.fillStyle = rgbStr(View.flash.c, View.flash.a); c.fillRect(0, 0, W, H); }
    if (!R.vig) {   // Vignette nur an den Rändern (die Mitte bleibt unangetastet → billig)

  renderBubble() {
    const tv = Game.trav, E_ = UI.els;
    const show = tv && ["enter", "inspect", "resolve", "exit"].includes(Game.phase);
    E_.bubble.classList.toggle("hidden", !show);
    if (!show) return;
    E_.bWho.textContent = t(tv.k.name);
    if (Game.phase === "enter") { if (!E_.bText.querySelector(".dots")) E_.bText.innerHTML = '<span class="dots"><span>•</span><span>•</span><span>•</span></span>'; }
    else { const s = t(tv.k.say); if (E_.bText.textContent !== s) E_.bText.textContent = s; }
  },
  renderTools() {
    const can = Game.canAct() && !UI.overlay, tv = Game.trav;
    UI.els.tools.querySelectorAll(".tool").forEach(b => {
      const tool = b.dataset.tool, used = !!Game.used[tool];
      b.querySelector(".tool-name").textContent = t("tool." + tool);
      b.querySelector(".tool-desc").textContent = t("tool." + tool + ".d");
      const v = used && tv ? tv.f[tool].v : null;
      b.classList.toggle("used", used);
      b.classList.toggle("v-red", v === 1); b.classList.toggle("v-green", v === -1); b.classList.toggle("v-grey", v === 0);
      b.disabled = !can || used || Game.points <= 0;
      b.setAttribute("aria-label", t("tool." + tool) + " – " + t("tool." + tool + ".d") + (used ? " (" + t("v." + (v > 0 ? "red" : v < 0 ? "green" : "grey")) + ")" : ""));
    });
    const on = Game.trav ? Game.points : 0;
    UI.els.leds.querySelectorAll(".led").forEach((l, i) => l.classList.toggle("on", i < on));
  },
  renderSusp() {
    const E_ = UI.els, tv = Game.trav, s = Game.suspicion();
    E_.needle.style.setProperty("--s", s);
    let w = "susp.w0";
    if (Game.result && tv) w = isInnocent(tv.type) ? "susp.clean" : "susp.corrupt";
    else if (tv && Game.order.length) {
      const vs = Game.order.map(x => tv.f[x].v);
      if (s >= 75) w = "susp.w2"; else if (s <= 40) w = "susp.w1"; else if (vs.every(v => v === 0)) w = "susp.w3";
    }
    E_.suspWord.textContent = t(w);
    let html = "";
    if (tv) {
      Game.order.forEach(x => { const v = tv.f[x].v; html += '<span class="chip ' + (v > 0 ? "red" : v < 0 ? "green" : "grey") + '"></span>'; });
      if (Game.result) TOOLS.forEach(x => { if (!Game.used[x]) { const v = tv.f[x].v; html += '<span class="chip dim ' + (v > 0 ? "red" : v < 0 ? "green" : "grey") + '"></span>'; } });
    }
    if (E_.chips.innerHTML !== html) E_.chips.innerHTML = html;
  },
  renderLog(fresh) {
    const tv = Game.trav, E_ = UI.els;
    if (!tv) { E_.log.innerHTML = ""; return; }
    const entries = Game.order.map(tool => ({ tool, checked: true }));
    if (Game.result) TOOLS.forEach(tool => { if (!Game.used[tool]) entries.push({ tool, checked: false }); });
    if (!entries.length) { E_.log.innerHTML = '<li class="log-empty">' + esc(t("log.empty")) + "</li>"; return; }
    E_.log.innerHTML = entries.map(e => {
      const f = tv.f[e.tool], cls = f.v > 0 ? "red" : f.v < 0 ? "green" : "grey";
      const vtxt = e.checked ? t("v." + cls) : t("log.unchecked") + " · " + t("v." + cls);
      return '<li class="row ' + cls + (e.checked ? "" : " unchecked") + (e.tool === fresh ? " new" : "") + '"><div class="row-in"><div class="row-card">' +
        '<div class="row-top"><span>' + esc(t("tool." + e.tool)) + '</span><span class="row-v">' + esc(vtxt) + "</span></div>" +
        '<div class="row-text">' + esc(t(f.k)) + "</div></div></div></li>";
    }).join("");
  },
  renderResolution() {
    const r = Game.result, tv = Game.trav, E_ = UI.els;
    if (!r || !tv || !["resolve", "exit"].includes(Game.phase)) { E_.res.hidden = true; return; }
    E_.res.hidden = false;
    E_.res.className = "resolution " + (r.correct ? "res-ok" : "res-bad");
    const innocent = isInnocent(tv.type);
    const vkey = "verdict." + (r.correct ? "ok" : "bad") + "." + (r.accept ? "accept" : "reject") + "." + tv.type;
    const hint = r.correct ? null : (innocent ? "hint.innocent" : "hint." + tv.type);
    let sc = "";
    if (r.correct) {
      sc += "<span>" + esc(t("score.base", { n: Game.n })) + '</span><span class="num">+' + I18N.num(r.base) + "</span>";
      if (r.gut) sc += "<span>" + esc(t("score.gut")) + '</span><span class="num">+' + r.gut + "</span>";
      if (r.saved) sc += "<span>" + esc(t("score.saved", { n: r.savedN })) + '</span><span class="num">+' + r.saved + "</span>";
      sc += '<span class="tot">' + esc(t("score.total")) + '</span><span class="tot num">+' + I18N.num(r.total) + "</span>";
    } else sc += '<span class="neg">' + esc(t("score.lost")) + '</span><span class="neg">♥</span>';
    E_.res.innerHTML =
      '<div class="res-head"><span class="res-stamp">' + esc(t(r.correct ? "res.ok" : "res.bad")) + '</span><span class="res-cat">' + esc(t("res.was")) + ": " + esc(t("cat." + tv.type)) + "</span></div>" +
      '<p class="res-line">' + esc(t(vkey)) + "</p>" + (hint ? '<p class="res-hint">' + esc(t(hint)) + "</p>" : "") +
      '<div class="res-truth"><b>' + esc(t("res.truth")) + "</b>" + esc(t(tv.k.truth)) + "</div>" +
      '<div class="res-score">' + sc + "</div>";
  },
  renderDecide() {
    const E_ = UI.els, ph = Game.phase;
    let html, sig;
    if (ph === "resolve" || ph === "exit") {
      const last = Game.hearts <= 0 || Game.n % CONFIG.shiftLength === 0;
      sig = "n|" + ph + "|" + last + "|" + I18N.lang;
      html = '<button type="button" class="btn-dec next" data-act="next"' + (ph === "exit" ? " disabled" : "") + ">" + esc(t(last ? "btn.eval" : "btn.next")) + '<span class="k">' + esc(t("key.next")) + "</span></button>";
    } else {
      const dis = !Game.canAct() || !!UI.overlay;
      sig = "d|" + dis + "|" + I18N.lang;
      html = '<button type="button" class="btn-dec accept" data-act="accept"' + (dis ? " disabled" : "") + ">" + esc(t("btn.accept")) + '<span class="k">' + esc(t("key.accept")) + "</span></button>" +
             '<button type="button" class="btn-dec reject" data-act="reject"' + (dis ? " disabled" : "") + ">" + esc(t("btn.reject")) + '<span class="k">' + esc(t("key.reject")) + "</span></button>";
    }
    if (E_.decide.dataset.sig !== sig) { E_.decide.dataset.sig = sig; E_.decide.innerHTML = html; }
  },

  /* ---------- Overlays ---------- */
  openOverlay(name) {
    if (UI.overlay && UI.overlay !== name) UI.overlayStack.push(UI.overlay);
    UI.overlay = name; UI.els.overlay.hidden = false; UI.renderOverlay(); UI.update();
    const p = UI.els.card.querySelector("[data-primary]"); if (p && p.focus) p.focus({ preventScroll: true });
  },
  closeOverlay(all) {
    if (all) UI.overlayStack = [];
    UI.overlay = UI.overlayStack.pop() || null;
    if (!UI.overlay) UI.els.overlay.hidden = true; else UI.renderOverlay();
    UI.update();
  },
  primaryAction() {
    const o = UI.overlay;
    if (o === "title") Game.start(); else if (o === "shiftEnd") Game.continueShift();
    else if (o === "gameOver" || o === "confirm") Game.restart(); else if (o === "menu") UI.closeOverlay();
  },
  cardAction(a) {
    if (a === "start") Game.start();
    else if (a === "close") UI.closeOverlay();
    else if (a === "restart") UI.openOverlay("confirm");
    else if (a === "yes") Game.restart();
    else if (a === "no") UI.closeOverlay();
    else if (a === "continue") Game.continueShift();
    else if (a === "newrun") Game.restart();
    else if (a.startsWith("q-")) { Quality.setMode(a.slice(2)); UI.renderOverlay(); }
    else if (a === "dbg-on" || a === "dbg-off") { if ((a === "dbg-on") !== UI.debug) UI.toggleDebug(); else UI.renderOverlay(); }
    else if (a.startsWith("lang-")) UI.setLang(a.slice(5));
  },
  btn(act, label, cls, primary, key) {
    return '<button type="button" class="btn-dec ' + cls + '" data-act="' + act + '"' + (primary ? " data-primary" : "") + ">" + esc(label) + (key ? '<span class="k">' + esc(key) + "</span>" : "") + "</button>";
  },
  renderOverlay() {
    const o = UI.overlay, card = UI.els.card; if (!o) return;
    let h = '<div class="inner">';
    if (o === "title") {
      const best = Store.get("best", 0) || 0;
      h += "<h1>" + esc(t("title.main")) + "</h1><h2>" + esc(t("title.sub")) + '</h2><p class="tag">' + esc(t("title.tag")) + "</p>" +
           "<p>" + esc(t("intro.p1")) + "</p><ul>" + ["intro.r1", "intro.r2", "intro.r3", "intro.r4", "intro.r5"].map(k => "<li>" + esc(t(k)) + "</li>").join("") + "</ul>" +
           '<p class="keys kb">' + esc(t("intro.keys")) + "</p>" +
           (best ? '<p class="best">' + esc(t("intro.best")) + ': <span class="num">' + I18N.num(best) + "</span></p>" : "") +
           '<div class="actions">' + UI.btn("start", t("btn.start"), "accept", true, t("key.enter")) + "</div>";
    } else if (o === "menu") {
      const seg = (items) => '<div class="seg">' + items.map(([act, label, on]) => '<button type="button" data-act="' + act + '" class="' + (on ? "on" : "") + '">' + esc(label) + "</button>").join("") + "</div>";
      h += '<h1 style="font-size:1.5em">' + esc(t("menu.title")) + "</h1>" +
           "<h3>" + esc(t("menu.lang")) + "</h3>" + seg(LANGS.map(lg => ["lang-" + lg, I18N.tl(lg, "lang.name"), I18N.lang === lg])) +
           "<h3>" + esc(t("menu.quality")) + "</h3>" + seg([["q-auto", t("q.auto"), Quality.mode === "auto"], ["q-high", t("q.high"), Quality.mode === "high"], ["q-low", t("q.low"), Quality.mode === "low"]]) +
           '<p class="keys">' + esc(t("menu.qinfo")) + "</p>" +
           "<h3>" + esc(t("menu.debug")) + "</h3>" + seg([["dbg-on", t("menu.on"), UI.debug], ["dbg-off", t("menu.off"), !UI.debug]]) +
           "<h3>" + esc(t("menu.keys")) + "</h3><ul>" + ["keys.1", "keys.2", "keys.3", "keys.4"].map(k => "<li>" + esc(t(k)) + "</li>").join("") + "</ul>" +
           '<div class="actions">' + UI.btn("close", t("btn.close"), "next", true, t("key.esc")) + (UI.overlayStack.includes("title") ? "" : UI.btn("restart", t("btn.restart"), "reject", false, t("key.r"))) + "</div>";
    } else if (o === "confirm") {
      h += '<h1 style="font-size:1.5em">' + esc(t("confirm.title")) + "</h1><p>" + esc(t("confirm.text")) + "</p>" +
           '<div class="actions">' + UI.btn("yes", t("btn.yes"), "reject", true, t("key.enter")) + UI.btn("no", t("btn.no"), "next", false, t("key.esc")) + "</div>";
    } else if (o === "shiftEnd" || o === "gameOver") {
      const s = Game.stats, over = o === "gameOver", night = Game.isNightShift();
      const row = (k, v) => "<span>" + esc(t(k)) + '</span><span class="v num">' + v + "</span>";
      h += "<h1>" + esc(t(over ? "over.title" : "end.title")) + "</h1><h2>" + esc(t(over ? "over.sub" : (night ? "end.sub.night" : "end.sub.day"))) + "</h2>" +
           '<div class="stats">' + row("stat.travelers", Game.n) + row("stat.correct", s.correct) + row("stat.wrong", s.wrong) + row("stat.caught", s.caught) +
           row("stat.let", s.let) + row("stat.honestRej", s.honestRej) + row("stat.gut", s.gut) + row("stat.score", I18N.num(Game.score)) + row("stat.best", I18N.num(Math.max(Game.best, Game.score))) + "</div>" +
           (Game.newBest ? '<p class="best">' + esc(t("stat.newBest")) + "</p>" : "") +
           '<div class="rank"><small>' + esc(t("rank.title")) + "</small><br>" + esc(t(Game.rankKey())) + "</div>" +
           (over ? "" : "<p>" + esc(t(night ? "end.next.day" : "end.next.night")) + "</p>") +
           '<div class="actions">' + (over ? UI.btn("newrun", t("btn.restart"), "accept", true, t("key.enter")) : UI.btn("continue", t("btn.continue"), "accept", true, t("key.enter")) + UI.btn("newrun", t("btn.restart"), "reject", false, t("key.r"))) + "</div>";
    }
    h += "</div>";
    card.innerHTML = h;
  },

  toast(key, vars) {
    const el = UI.els.toast; UI.toastData = { key, vars };
    el.textContent = t(key, vars); el.classList.add("show");
    clearTimeout(UI.toastTimer);
    UI.toastTimer = setTimeout(() => { el.classList.remove("show"); UI.toastData = null; }, 2600);
  },
  showFps(fps) { if (UI.debug) UI.els.fps.textContent = t("fps.line", { f: Math.round(fps), l: Quality.level, m: t("q." + Quality.mode), p: FX.list.length + FX.sand.length }); }
};

/* ==========================================================================
   MODUL 7: EINGABE – Tastatur (Layout-unabhängig über e.code) + Touch/Maus
   ========================================================================== */
const Input = {
  held: new Set(), rArmed: 0,
  init() {
    window.addEventListener("keydown", Input.onKey);
    window.addEventListener("keyup", e => Input.held.delete(e.code));
    window.addEventListener("blur", () => Input.clearHeld());
    document.addEventListener("visibilitychange", () => { if (document.hidden) Input.clearHeld(); });
  },
  clearHeld() { Input.held.clear(); Input.rArmed = 0; },
  onKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const code = e.code;
    if (e.repeat || Input.held.has(code)) { if (code === "Space") e.preventDefault(); return; }   // gehaltene Taste löst nur einmal aus
    Input.held.add(code);
    const ae = document.activeElement, onButton = ae && ae.tagName === "BUTTON";
    if (code === "KeyS") { e.preventDefault(); UI.toggleLang(); return; }
    if (code === "KeyF") { UI.toggleDebug(); return; }
    if (code === "KeyQ") { UI.cycleQuality(); return; }
    if (code === "Escape") { if (UI.overlay === "menu" || UI.overlay === "confirm") UI.closeOverlay(); return; }
    if (UI.overlay) {
      if (code === "Enter" || code === "Space" || code === "NumpadEnter") { if (onButton) return; e.preventDefault(); UI.primaryAction(); }
      else if (code === "KeyR" && UI.overlay !== "menu") Game.restart();
      else if (code === "KeyR" && UI.overlay === "menu") UI.openOverlay("confirm");
      return;
    }
    const map = { Digit1: "seal", Numpad1: "seal", Digit2: "wealth", Numpad2: "wealth", Digit3: "papers", Numpad3: "papers", Digit4: "cargo", Numpad4: "cargo" };
    if (map[code]) { e.preventDefault(); Game.useTool(map[code]); return; }
    if (code === "KeyA") { Game.decide(true); return; }
    if (code === "KeyD") { Game.decide(false); return; }
    if (code === "Enter" || code === "Space" || code === "NumpadEnter") {
      if (onButton) return;
      e.preventDefault();
      if (Game.phase === "resolve") Game.advance(); else if (Game.phase === "enter") View.skipEnter();
      return;
    }
    if (code === "KeyR") {
      const now = performance.now();
      if (Input.rArmed && now - Input.rArmed < 2500) { Input.rArmed = 0; Game.restart(); }
      else { Input.rArmed = now; UI.toast("toast.confirmR"); }
    }
  }
};

/* ==========================================================================
   MODUL 8: HAUPTSCHLEIFE – fester Zeitschritt (1/60 s), Rendering pro Frame
   ========================================================================== */
const Main = {
  STEP: 1 / 60, acc: 0, last: 0, pendingResize: false,
  frame(now) {
    let dt = (now - Main.last) / 1000; Main.last = now;
    if (!(dt > 0)) dt = 0; if (dt > .25) dt = .25;      // Tab-Wechsel: keine Riesenschritte
    Quality.sample(dt);
    Main.acc += dt; let n = 0;
    while (Main.acc >= Main.STEP && n < 5) { View.update(Main.STEP); Main.acc -= Main.STEP; n++; }
    if (n === 5) Main.acc = 0;
    if (Main.pendingResize) { Main.pendingResize = false; UI.placeBubble(); R.resize(); }
    R.render();
    UI.tick();
    requestAnimationFrame(Main.frame);
  },
  requestResize() { Main.pendingResize = true; }
};

function detectLang() {
  const saved = Store.get("lang", null);
  if (saved && LANGS.includes(saved)) return saved;
  const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "de"]);
  return String(list[0] || "de").toLowerCase().startsWith("ar") ? "ar" : "de";
}

function boot() {
  TRAVELERS.forEach(rec => PREMADE.push(prepareTraveler(rec)));
  I18N.lang = detectLang();
  View.reduced = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  Quality.init();
  UI.init();
  UI.applyLang();
  UI.placeBubble();
  R.init();
  Input.init();
  Game.best = Store.get("best", 0) || 0;
  Game.stats = Game.freshStats();
  View.reset();
  UI.renderAll();
  UI.openOverlay("title");
  window.addEventListener("resize", Main.requestResize);
  window.addEventListener("orientationchange", () => { Main.requestResize(); setTimeout(Main.requestResize, 250); });
  if (window.ResizeObserver) new ResizeObserver(Main.requestResize).observe(document.getElementById("stage"));
  requestAnimationFrame(tm => { Main.last = tm; Main.frame(tm); });
}
boot();

/* ==========================================================================
   DRITTE SPRACHE ERGÄNZEN (Kurzanleitung)
   1. "xx" in LANGS eintragen und LANG_META.xx = { dir: "ltr"|"rtl", canvasScale } setzen,
      FONT_CANVAS.xx und eine #app[lang="xx"]-Regel im CSS ergänzen.
   2. L.xx = { ... } mit allen Schlüsseln aus L.de anlegen (fehlende → Deutsch).
   3. In TRAVELERS jedem Text-Array ein drittes Element anhängen: [de, ar, xx]
      (Befunde: [wert, de, ar, xx] – dafür prepareTraveler: [a[1], a[2], a[3]]).
   4. Wortlisten in W um die dritte Form erweitern (oder Deutsch als Rückfall nutzen).
   5. Sprachknopf (#btnLang) um ein <span> mit data-i18n="lang.xx" ergänzen.
   ========================================================================== */
</script>
</body>
