<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a140e">
<meta name="color-scheme" content="dark">
<title></title>
<style>
/* ==========================================================================
   GRENZKONTROLLE – Die korrupten Gobolde
   Stil: Wüsten-Grenzposten. Alle Abstände und Positionen nutzen logische
   CSS-Eigenschaften (inline/block), damit LTR (Deutsch) und RTL (Arabisch)
   ohne Sonderregeln funktionieren.
   ========================================================================== */
:root{
  --bg:#120d09; --panel:#1d1610; --panel2:#2a2117; --line:#0a0705;
  --ink:#2a1e12; --ink-soft:#5f4b33; --paper:#f4ead2; --paper2:#e8d9b6;
  --card:#c99f60; --card2:#b0844a; --card-edge:#83592a;
  --metal-hi:#cfd4d8; --metal:#959ca2; --metal-lo:#5d646a; --metal-dk:#363b40;
  --green:#3fae5a; --green-dk:#226f37; --red:#d8463b; --red-dk:#8d241c; --grey:#9a968a;
  --amber:#ffb84a; --txt:#f4ead6; --txt-dim:#cbbd9f;
  --to-end:right; --to-start:left;
  --font-de: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --font-ar: "Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro","Damascus","Segoe UI",Tahoma,Arial,system-ui,sans-serif;
  --font-mono: ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
  --font-type: "Courier New",ui-monospace,Menlo,Consolas,monospace;
  --font: var(--font-de);
  --topbar-h: 56px;
}
*{box-sizing:border-box}
html,body{margin:0;block-size:100%;background:var(--bg);color:var(--txt);overflow:hidden;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums}

/* ---------- Wurzelcontainer: Sprache + Richtung ---------- */
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);
  font-family:var(--font);font-size:16px;line-height:1.4;
  padding-block:env(safe-area-inset-top) env(safe-area-inset-bottom);
  padding-inline:max(env(safe-area-inset-left),env(safe-area-inset-right))}
#app[dir="rtl"]{--to-end:left;--to-start:right}
/* Arabisch: eine Stufe größer, eigene Schriftliste mit arabischen Glyphen */
#app[lang="ar"]{--font:var(--font-ar);--font-type:var(--font-ar);font-size:18px;line-height:1.55}

/* ---------- Kopfleiste ---------- */
#topbar{position:relative;z-index:30;display:flex;align-items:center;gap:.6em;
  padding-block:.3em;padding-inline:.6em;min-block-size:var(--topbar-h);
  background:linear-gradient(#3b3631,#221f1b);border-block-end:2px solid var(--line);
  box-shadow:0 2px 0 rgba(255,255,255,.04) inset}
.brand{font-weight:900;letter-spacing:.08em;font-size:.82em;color:#e9d3a3;white-space:nowrap;
  text-shadow:0 1px 0 #000;display:none}
@media (min-width:760px){.brand{display:block}}
.hud{display:flex;align-items:center;gap:.9em;flex:1;min-inline-size:0;flex-wrap:wrap;row-gap:.2em}
.hud-item{display:flex;flex-direction:column;line-height:1.05;min-inline-size:0}
.hud-label{font-size:.6em;opacity:.72;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.hud-val{font-family:var(--font-mono);font-size:1.02em;color:var(--amber);font-weight:700;
  text-shadow:0 0 6px rgba(255,180,70,.45)}
.hearts{display:flex;gap:.08em;font-size:1.2em;line-height:1}
.heart{color:#e2463b;text-shadow:0 0 6px rgba(226,70,59,.6);transition:transform .3s,opacity .3s,filter .3s}
.heart.lost{opacity:.22;filter:grayscale(1);text-shadow:none;transform:scale(.8)}
.heart.pop{animation:heartPop .6s ease-out}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.6)}100%{transform:scale(.8)}}
.top-actions{display:flex;gap:.4em;margin-inline-start:auto;align-items:center}
.icon-btn,.lang-btn{min-block-size:44px;min-inline-size:44px;border-radius:.45em;
  border:1px solid #11100e;background:linear-gradient(#5f646a,#3b4045);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 2px 0 #0d0c0a;font-weight:800}
.icon-btn{font-size:1.15em;padding:0}
.lang-btn{direction:ltr;unicode-bidi:isolate;display:flex;align-items:center;gap:.35em;
  padding-inline:.7em;font-size:.95em;font-family:var(--font-de)}
.lang-btn span{opacity:.55;transition:opacity .2s,color .2s}
.lang-btn .ar{font-family:var(--font-ar);font-size:1.15em}
.lang-btn .on{opacity:1;color:var(--amber);text-shadow:0 0 6px rgba(255,184,74,.6)}
.lang-btn .sep{opacity:.35}

/* ---------- Hauptlayout: Hochformat = Bühne oben, Akte darunter ---------- */
#main{display:grid;min-block-size:0;grid-template-columns:minmax(0,1fr);
  grid-template-rows:minmax(160px,34%) minmax(0,1fr) auto}
#stage{position:relative;min-block-size:0;overflow:hidden;background:#000;
  border-block-end:2px solid var(--line)}
#cv{position:absolute;inset:0;inline-size:100%;block-size:100%;display:block;touch-action:manipulation}
#panel{min-block-size:0;overflow-y:auto;overflow-x:hidden;padding:.6em;
  background:radial-gradient(120% 60% at 50% 0%,#2a2117 0%,#18120c 70%);
  overscroll-behavior:contain;container-type:inline-size;scroll-behavior:smooth}
#decide{display:grid;grid-template-columns:1fr 1fr;gap:.6em;padding:.55em .6em;
  background:linear-gradient(#211a13,#15100b);border-block-start:2px solid var(--line)}
/* Querformat / PC: Bühne links (bzw. rechts bei RTL), Akte daneben */
@media (min-aspect-ratio:1/1) and (min-width:700px){
  #main{grid-template-columns:minmax(0,1fr) clamp(330px,36%,480px);grid-template-rows:minmax(0,1fr) auto}
  #stage{grid-row:1 / span 2;grid-column:1;border-block-end:0;border-inline-end:2px solid var(--line)}
  #panel{grid-row:1;grid-column:2}
  #decide{grid-row:2;grid-column:2}
}
@media (min-aspect-ratio:1/1) and (max-height:520px) and (min-width:560px){
  #main{grid-template-columns:minmax(0,1fr) minmax(300px,50%);grid-template-rows:minmax(0,1fr) auto}
  #stage{grid-row:1 / span 2;grid-column:1;border-block-end:0;border-inline-end:2px solid var(--line)}
  #panel{grid-row:1;grid-column:2}
  #decide{grid-row:2;grid-column:2}
}

/* ---------- Sprechblase ---------- */
.bubble{position:relative;background:#fbf6ea;color:#231a10;border:2px solid #2a1f14;border-radius:1em;
  padding-block:.6em .7em;padding-inline:.85em;box-shadow:0 4px 0 rgba(0,0,0,.35);
  transition:opacity .25s,transform .25s;transform-origin:50% 0}
.bubble.hidden{opacity:0;transform:scale(.9);pointer-events:none}
.bubble-who{display:block;font-size:.72em;font-weight:800;letter-spacing:.04em;color:#7a5a32;
  text-transform:uppercase;margin-block-end:.15em}
.bubble-text{margin:0;font-size:1.04em;line-height:1.5;font-style:italic;text-align:start}
#app[lang="ar"] .bubble-text{font-style:normal}
.bubble::before{content:"";position:absolute;inline-size:0;block-size:0}
#panel .bubble{margin-block-end:.65em}
#panel .bubble::before{inset-block-start:-14px;inset-inline-start:calc(50% - 10px);
  border-inline:10px solid transparent;border-block-end:14px solid #2a1f14}
#stage .bubble{position:absolute;inset-block-start:9%;inset-inline-end:3%;
  max-inline-size:min(47%,440px);max-block-size:62%;overflow:auto;z-index:2}
#stage .bubble::before{inset-block-start:1.1em;inset-inline-start:-15px;
  border-block:9px solid transparent;border-inline-end:15px solid #2a1f14}
.dots span{display:inline-block;animation:dot 1.2s infinite;font-style:normal;font-weight:900}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}

/* ---------- Toast ---------- */
.toast{position:absolute;inset-inline:0;inset-block-end:.6em;margin-inline:auto;inline-size:max-content;
  max-inline-size:92%;padding:.45em .9em;border-radius:2em;background:rgba(18,13,9,.88);color:#fff2d6;
  border:1px solid rgba(255,200,120,.35);font-size:.9em;text-align:center;z-index:3;
  opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* ---------- Akte (Pappe) ---------- */
.folder{position:relative;margin-block:1.3em .7em;padding:.55em;border-radius:.5em;
  background:
    repeating-linear-gradient(97deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px),
    repeating-linear-gradient(7deg,rgba(80,50,20,.07) 0 1px,transparent 1px 5px),
    linear-gradient(180deg,var(--card),var(--card2));
  border:1px solid var(--card-edge);box-shadow:0 3px 0 #5d3f1e,0 8px 18px rgba(0,0,0,.45)}
.folder-tab{position:absolute;inset-block-start:-1.25em;inset-inline-start:.8em;padding-block:.15em;padding-inline:.9em;
  background:linear-gradient(var(--card),#bd9154);border:1px solid var(--card-edge);border-block-end:0;
  border-start-start-radius:.45em;border-start-end-radius:.45em;font-weight:900;letter-spacing:.14em;
  color:#4a3014;font-size:.8em}
.clip{position:absolute;inset-block-start:-.75em;inset-inline-end:1.4em;inline-size:1.1em;block-size:2.5em;
  border:3px solid #9aa1a7;border-radius:.6em;border-block-end-color:transparent;z-index:2;
  box-shadow:0 1px 0 #444}
.paper{position:relative;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);
  border-radius:.25em;padding:.55em .75em .6em;box-shadow:0 1px 2px rgba(0,0,0,.35);overflow:hidden}
.paper::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 1.55em,rgba(120,90,50,.13) 1.55em 1.6em)}
.paper-head{display:flex;justify-content:space-between;align-items:baseline;gap:.5em;
  font-size:.72em;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);
  border-block-end:1px dashed rgba(90,70,40,.45);padding-block-end:.25em;margin-block-end:.35em;text-transform:uppercase}
.fields{display:grid;grid-template-columns:auto 1fr;gap:.18em .8em;margin:0;position:relative;z-index:1}
.fields dt{font-size:.74em;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;
  align-self:center;white-space:nowrap}
.fields dd{margin:0;font-family:var(--font-type);font-weight:700;font-size:1.02em;color:#1d140b;
  overflow-wrap:anywhere}
#app[lang="ar"] .fields dd{font-weight:700}
.stamp-mark{position:absolute;inset-block-end:.35em;inset-inline-end:.5em;transform:rotate(-9deg);
  border:2px solid rgba(170,40,30,.45);color:rgba(170,40,30,.5);padding:.05em .5em;border-radius:.25em;
  font-weight:900;font-size:.72em;letter-spacing:.15em;pointer-events:none}
.folder.flash{animation:folderFlash .6s}
@keyframes folderFlash{0%{transform:translateY(-6px);opacity:.3}100%{transform:none;opacity:1}}

/* ---------- Werkzeuge (Metall) ---------- */
/* Werkzeugleiste klebt unten im Panel, solange Akte/Aussage gelesen werden → immer erreichbar */
.toolbox{position:sticky;inset-block-end:-.6em;z-index:2;margin-block:.7em;padding:.55em;border-radius:.55em;
  background:linear-gradient(#3e4348,#2a2e32);border:1px solid #121416;
  box-shadow:0 2px 0 rgba(255,255,255,.08) inset,0 -8px 16px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.4)}
.toolbox-head{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin-block-end:.45em;
  font-size:.76em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#d9dee2}
.pts{display:flex;align-items:center;gap:.4em}
.led{inline-size:.95em;block-size:.95em;border-radius:50%;background:#3a2a10;border:1px solid #000;
  box-shadow:0 0 0 2px #22262a inset;transition:background .25s,box-shadow .25s}
.led.on{background:radial-gradient(circle at 35% 35%,#fff4c8,#ffb030 55%,#b56a00);
  box-shadow:0 0 8px rgba(255,176,48,.85)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5em}
@container (min-width:560px){.tools{grid-template-columns:repeat(4,minmax(0,1fr))}}

.tool{position:relative;min-block-size:64px;display:grid;grid-template-columns:auto 1fr;align-items:center;
  gap:.15em .5em;padding:.45em .55em;border-radius:.45em;text-align:start;color:#15181b;border:1px solid #1d2023;
  background:
    radial-gradient(circle at .5em .5em,#e9edf0 0 .14em,#555b60 .17em,transparent .22em),
    radial-gradient(circle at calc(100% - .5em) .5em,#e9edf0 0 .14em,#555b60 .17em,transparent .22em),
    repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 3px),
    linear-gradient(180deg,var(--metal-hi),var(--metal) 55%,var(--metal-lo));
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 3px 0 #1b1e21;transition:transform .08s,filter .2s,box-shadow .2s}
.tool:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 1px 0 #1b1e21}
.tool svg{inline-size:1.9em;block-size:1.9em;grid-row:span 2}
.tool-name{font-weight:900;letter-spacing:.05em;font-size:.92em;line-height:1.1}
.tool-desc{font-size:.68em;line-height:1.15;color:#2c3136}
.tool-key{position:absolute;inset-block-start:.25em;inset-inline-end:.35em;font-family:var(--font-mono);font-size:.7em;
  font-weight:800;background:#23272b;color:#ffd27e;border-radius:.3em;padding:0 .35em;unicode-bidi:isolate}
.tool:disabled{cursor:default;filter:saturate(.3) brightness(.72)}
.tool.used{filter:none;background:linear-gradient(180deg,#7d8389,#5f656b 60%,#4b5056);color:#f0f2f4}
.tool.used .tool-desc{color:#e2e6e9}
.tool.used::after{content:"";position:absolute;inset-block-end:.35em;inset-inline-end:.4em;inline-size:.8em;block-size:.8em;
  border-radius:50%;border:1px solid #000}
.tool.v-red::after{background:var(--red);box-shadow:0 0 8px var(--red)}
.tool.v-green::after{background:var(--green);box-shadow:0 0 8px var(--green)}
.tool.v-grey::after{background:#c9c5b8;box-shadow:0 0 6px #c9c5b8}
.tool.hit{animation:toolHit .4s}
@keyframes toolHit{0%{transform:scale(1)}40%{transform:scale(.95)}100%{transform:scale(1)}}

/* Kompakte Werkzeugleiste für schmale Panels (Handy): 4 Spalten, ohne Beschreibung */
@container (max-width:470px){
  .tools{grid-template-columns:repeat(4,minmax(0,1fr));gap:.35em}
  .tool{grid-template-columns:1fr;justify-items:center;text-align:center;min-block-size:60px;padding:.45em .15em .4em;gap:.1em}
  .tool svg{grid-row:auto;inline-size:1.55em;block-size:1.55em}
  .tool-desc{display:none}
  .tool-name{font-size:.76em;letter-spacing:.02em}
  .toolbox-head{margin-block-end:.35em}
  .tool.used::after{inset-block-end:auto;inset-block-start:.32em;inset-inline-end:auto;inset-inline-start:.32em;inline-size:.7em;block-size:.7em}
}
/* ---------- Verdachtsbalken ---------- */
.susp{margin-block:.7em;padding:.5em .6em;border-radius:.5em;background:#15100b;border:1px solid #000}
.susp-head{display:flex;justify-content:space-between;align-items:baseline;font-size:.76em;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:var(--txt-dim);margin-block-end:.35em}
.susp-track{position:relative;block-size:16px;border-radius:8px;border:1px solid #000;
  background:linear-gradient(to var(--to-end),#2f8f48,#6f6c62 50%,#c33b31);
  box-shadow:0 2px 4px rgba(0,0,0,.6) inset}
.susp-needle{position:absolute;inset-block:-5px;inline-size:12px;margin-inline-start:-6px;
  inset-inline-start:calc(var(--s,50) * 1%);border-radius:4px;background:linear-gradient(#fff,#cfc6b3);
  border:1px solid #000;box-shadow:0 0 8px rgba(255,255,255,.6);
  transition:inset-inline-start .7s cubic-bezier(.3,1.5,.5,1)}
.susp-ends{display:flex;justify-content:space-between;font-size:.7em;color:var(--txt-dim);margin-block-start:.25em}
.susp-chips{display:flex;gap:.3em;margin-block-start:.35em;min-block-size:.7em;flex-wrap:wrap}
.chip{block-size:.7em;inline-size:2.2em;border-radius:.35em;border:1px solid #000;animation:chipIn .4s ease-out}
.chip.red{background:var(--red)}.chip.green{background:var(--green)}.chip.grey{background:var(--grey)}
.chip.dim{opacity:.35}
@keyframes chipIn{from{transform:scale(0)}to{transform:scale(1)}}

/* ---------- Prüfprotokoll ---------- */
.logbox{margin-block:.7em .4em}
.logbox h3{margin:0 0 .35em;font-size:.78em;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-dim)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:.4em}
.log-empty{font-size:.88em;color:var(--txt-dim);font-style:italic;padding:.3em 0}
.row{display:grid;grid-template-rows:1fr}
.row.new{animation:rowOpen .5s ease-out}
@keyframes rowOpen{from{grid-template-rows:0fr;opacity:0}to{grid-template-rows:1fr;opacity:1}}
.row-in{overflow:hidden;min-block-size:0}
.row-card{background:linear-gradient(#f3ead3,#e7d8b5);color:var(--ink);border-radius:.35em;
  border-inline-start:6px solid var(--c,#999);padding:.4em .6em;box-shadow:0 2px 0 rgba(0,0,0,.35)}
.row.red{--c:var(--red)}.row.green{--c:var(--green)}.row.grey{--c:var(--grey)}
.row.unchecked .row-card{opacity:.62;filter:saturate(.6)}
.row-top{display:flex;justify-content:space-between;gap:.5em;font-size:.72em;font-weight:900;letter-spacing:.06em;
  text-transform:uppercase;margin-block-end:.12em}
.row-v{color:var(--c)}
.row.red .row-v{color:#a8261c}.row.green .row-v{color:#1f6a33}.row.grey .row-v{color:#5d594f}
.row-text{font-size:.95em;line-height:1.42}

/* ---------- Auflösung ---------- */
.resolution{margin-block:.2em .8em;border-radius:.55em;padding:.7em .8em;color:var(--ink);
  background:linear-gradient(#f7efda,#eadcba);border:2px solid #2b1f13;box-shadow:0 5px 0 rgba(0,0,0,.4);
  animation:resIn .45s cubic-bezier(.2,1.4,.5,1)}
@keyframes resIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:.6em;margin-block-end:.35em}
.res-stamp{font-weight:900;font-size:1.45em;letter-spacing:.12em;padding:.05em .55em;border:3px solid currentColor;
  border-radius:.3em;transform:rotate(-4deg)}
.res-ok .res-stamp{color:#1f7a3a}.res-bad .res-stamp{color:#b4281e}
.res-cat{font-size:.78em;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);text-align:end}
.res-line{margin:.25em 0;font-weight:700;line-height:1.45}
.res-hint{margin:.25em 0;font-size:.92em;color:#6b3a10}
.res-truth{margin:.45em 0 .2em;padding:.45em .6em;background:rgba(255,255,255,.5);border-radius:.35em;
  border-inline-start:4px solid #7a5a32;line-height:1.45}
.res-truth b{display:block;font-size:.72em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.res-score{display:grid;grid-template-columns:1fr auto;gap:.1em 1em;margin-block-start:.45em;font-size:.88em}
.res-score .tot{font-weight:900;border-block-start:1px solid rgba(60,40,20,.4);padding-block-start:.15em}
.res-score .neg{color:#a8261c;font-weight:800}

/* ---------- Entscheidungsbuttons ---------- */
.btn-dec{position:relative;min-block-size:58px;border-radius:.55em;border:2px solid #0d0a07;font-weight:900;
  font-size:1.08em;letter-spacing:.07em;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.5);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 4px 0 #0a0805;transition:transform .08s,filter .2s}
.btn-dec:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 1px 0 #0a0805}
.btn-dec:disabled{filter:grayscale(.8) brightness(.6);cursor:default}
.btn-dec .k{position:absolute;inset-block-start:.3em;inset-inline-end:.45em;font-family:var(--font-mono);font-size:.62em;
  background:rgba(0,0,0,.35);border-radius:.3em;padding:0 .35em;unicode-bidi:isolate;letter-spacing:0}
.accept{background:linear-gradient(#49a960,#2a7a3d)}
.reject{background:linear-gradient(#d0503f,#962c22)}
.next{grid-column:1 / -1;background:linear-gradient(#c58a2c,#8a5a12)}

/* ---------- Overlay (Titel, Menü, Auswertung) ---------- */
#overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;
  padding:1em;padding-block-start:calc(var(--topbar-h) + env(safe-area-inset-top) + .8em);
  background:radial-gradient(80% 70% at 50% 40%,rgba(30,20,10,.55),rgba(5,3,2,.86))}
#overlay[hidden]{display:none}
.card{inline-size:min(100%,600px);max-block-size:100%;overflow:auto;border-radius:.7em;padding:1.1em 1.15em;
  color:var(--ink);background:
    repeating-linear-gradient(97deg,rgba(255,255,255,.05) 0 2px,transparent 2px 7px),
    linear-gradient(180deg,#d6b06f,#b88b4e);border:2px solid #5b3d1b;
  box-shadow:0 6px 0 #3b2711,0 20px 40px rgba(0,0,0,.6);animation:resIn .4s cubic-bezier(.2,1.3,.5,1)}
.card .inner{background:linear-gradient(var(--paper),var(--paper2));border-radius:.4em;padding:.9em 1em;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.card h1{margin:0;font-size:2em;letter-spacing:.06em;line-height:1.1;color:#3a240e;font-weight:900}
.card h2{margin:.1em 0 .4em;font-size:1.2em;color:#8d2a1c;font-weight:900}
.card h3{margin:.8em 0 .3em;font-size:.85em;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.card p{margin:.4em 0;line-height:1.5}
.card .tag{font-size:.85em;color:var(--ink-soft);font-weight:700}
.card ul{margin:.4em 0;padding-inline-start:1.2em;line-height:1.5}
.card li{margin-block:.15em}
.card .keys{font-size:.8em;color:var(--ink-soft);margin-block-start:.6em}
.card .actions{display:flex;gap:.6em;flex-wrap:wrap;margin-block-start:1em}
.card .actions .btn-dec{flex:1 1 12em}
.seg{display:flex;gap:.35em;flex-wrap:wrap}
.seg button{flex:1 1 6em;min-block-size:48px;border-radius:.45em;border:2px solid #3b2a17;background:#efe2c4;
  color:#3a2a17;font-weight:900;letter-spacing:.05em}
.seg button.on{background:#3a2a17;color:#ffd27e}
.stats{display:grid;grid-template-columns:1fr auto;gap:.2em 1em;margin:.3em 0;font-size:.95em}
.stats .v{font-weight:900;font-family:var(--font-mono)}
.rank{margin-block-start:.7em;padding:.5em .7em;border:3px double #7a2a1c;border-radius:.4em;text-align:center;
  font-weight:900;color:#7a2a1c;font-size:1.1em;transform:rotate(-1.5deg)}
.best{color:#1f7a3a;font-weight:900}
.fps{position:absolute;inset-block-start:.4em;inset-inline-start:.4em;z-index:4;font-family:var(--font-mono);font-size:12px;
  background:rgba(0,0,0,.6);color:#9f9;padding:.15em .45em;border-radius:.3em;pointer-events:none;unicode-bidi:isolate}
.fps[hidden]{display:none}
/* Touch-Geräte: Tastenkürzel-Hinweise ausblenden */
@media (hover:none) and (pointer:coarse){.btn-dec .k,.tool-key,.card .keys.kb{display:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

  </main>
  <div id="overlay" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

/* ---------- Sprachzustand & Zugriff ---------- */
const I18N = {
  lang: "de",
  /** Text der aktiven Sprache; {platzhalter} werden ersetzt. Fallback: Deutsch, dann Schlüssel. */
  t(key, vars) { return I18N.tl(I18N.lang, key, vars); },
  /** Text einer bestimmten Sprache (wird von der Generierung genutzt). */
  tl(lang, key, vars) {
    let s = (L[lang] && L[lang][key] !== undefined) ? L[lang][key] : (L.de[key] !== undefined ? L.de[key] : key);
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => {
      const v = vars[k];
      if (v === undefined || v === null) return m;
      if (typeof v === "object") return (v[lang] !== undefined ? v[lang] : v.de);   // {de:"..", ar:".."}
      return String(v);
    });
    return s;
  },
  /** Trägt ein Text-Array [de, ar, ...] in L ein (fehlende Sprachen → Deutsch). */
  reg(key, arr) { LANGS.forEach((lg, i) => { L[lg][key] = (arr[i] !== undefined ? arr[i] : arr[0]); }); },
  /** Trägt ein Objekt {de:"..", ar:".."} in L ein. */
  regObj(key, obj) { LANGS.forEach(lg => { L[lg][key] = (obj[lg] !== undefined ? obj[lg] : obj.de); }); },
  dir() { return LANG_META[I18N.lang].dir; },
  /** Zahlen: westliche Ziffern in allen Sprachen; nur das Tausender-Trennzeichen folgt der Sprache. */
  num(n) {
    const s = String(Math.round(n));
    if (Math.abs(n) < 10000) return s;
    const sep = I18N.lang === "de" ? "." : ",";
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  }
};
const t = (k, v) => I18N.t(k, v);

  name:["Labib al-Shairi","لبيب الشاعري"], job:["Dichter","شاعر"], from:["Barsa","البرصة"], why:["Lesung","أمسية شعريّة"],
  say:["Ich komme aus Basra, der schönsten Stadt am Schatt al-Arab. Ich habe ein Gedicht über diese Schranke geschrieben. Es reimt sich nicht.",
       "جئت من البصرة، أجمل مدن شطّ العرب. كتبت قصيدة عن هذا الحاجز، لكنّها بلا قافية."],
  f:{ seal:[-1,"Echt. Am Rand hat jemand einen Vers gekritzelt.","أصليّ، وعلى حافّته بيت شعر مخربش."],
      wealth:[-1,"3 Dinar. Dichter eben.","3 دينار. شاعر، ماذا تتوقّع؟"],
      papers:[0,"Im Pass steht „Barsa“ statt „Basra“. Das Register kennt ihn aus Basra – nur ein Buchstabendreher.","في الجواز «البرصة» بدل «البصرة». السجلّ يعرفه من البصرة، مجرّد خطأ في ترتيب الحروف."],
      cargo:[-1,"Ein Stapel Papier, zwei Tintenfässer, kein Proviant.","رزمة أوراق ومِحبرتان، ولا زاد."] },
  truth:["Labib ist sauber – nur sein Pass kann nicht buchstabieren. Wer ihn abweist, weist einen Tippfehler ab.",
         "لبيب نظيف، كلّ ما في الأمر أنّ جوازه لا يُحسن التهجئة. من يرفضه يرفض خطأً مطبعيًّا."] },

/* ---------------- STUFE 2: zwei Widersprüche, nur einer ist echt ---------------- */
{ id:"t11", type:"bribe", tier:2, g:"m", p:"human", look:{head:"keffiyeh"}, money:30,
  name:["Sharif al-Dallal","شريف الدلّال"], job:["Viehhändler","تاجر مواشٍ"], from:["Tall al-Ghurban","تلّ الغربان"], why:["Viehmarkt","سوق المواشي"],
  say:["Ich habe nur dreißig Dinar und dieses Huhn. Das Huhn ist nicht zu verkaufen – es ist für Sie. Und das Kästchen darunter auch.",
       "لا أملك إلّا ثلاثين دينارًا وهذه الدجاجة. الدجاجة ليست للبيع، إنّها لك. وكذلك الصندوق الصغير الذي تحتها."],
  f:{ seal:[-1,"Echt. Eine Hühnerfeder steckt als Lesezeichen darin.","أصليّ، وبين صفحاته ريشة دجاجة."],
      wealth:[1,"Im Kästchen unter dem Huhn: 2500 Dinar, säuberlich gebündelt. Angegeben: 30.","في الصندوق تحت الدجاجة: 2500 دينار مربوطة بعناية. المصرَّح به: 30."],
      papers:[0,"Register: Viehhändler. Seine Herde wurde letzten Winter gestohlen – nur das Huhn blieb.","السجلّ: تاجر مواشٍ، سُرق قطيعه الشتاء الماضي ولم تبقَ له إلّا الدجاجة."],
      cargo:[0,"Ein lebendes Huhn. Es legt ein Ei auf deinen Stempel. Kein Verstoß.","دجاجة حيّة باضت بيضة على ختمك. لا مخالفة."] },
  truth:["Dass ein Viehhändler nur noch ein Huhn hat, ist traurig, aber legal. Das Geld unter dem Huhn war es nicht.",
         "أن لا يملك تاجر المواشي إلّا دجاجة أمر محزن لكنّه قانونيّ. أمّا المال تحت الدجاجة فلا."] },

{ id:"t12", type:"identity", tier:2, g:"f", p:"human", look:{head:"scarf"}, money:3000,
  name:["Rayhana bint Hilal","ريحانة بنت هلال"], job:["Ärztin","طبيبة"], from:["Bagdad","بغداد"], why:["Kranke besuchen","عيادة المرضى"],
  say:["Ich bin Ärztin, seit Jahren. Fieber behandle ich mit Aderlass am Ohr – oder war das bei Kamelen? Egal. Das Geld habe ich von meinem Onkel geerbt.",
       "أنا طبيبة منذ سنين. أعالج الحمّى بالفصد من الأذن… أم أنّ ذلك للجِمال؟ لا يهمّ. أمّا المال فقد ورثته عن عمّي."],
  f:{ seal:[-1,"Echt, Bagdader Doppelstempel.","أصليّ، بختم بغداد المزدوج."],
      wealth:[0,"3000 Dinar, der Erbschein des Onkels liegt bei. Viel Geld, aber sauber.","3000 دينار، ومعها وثيقة إرث من العمّ. مبلغ كبير، لكنّه نظيف."],
      papers:[1,"Register: keine Ärztin. Eingetragen als Wahrsagerin, mit Berufsverbot in Bagdad.","السجلّ: ليست طبيبة. مسجَّلة عرّافةً، وممنوعة من مزاولة عملها في بغداد."],
      cargo:[0,"Eine Kristallkugel, Muscheln, getrocknete Eidechsen. Kein einziges Arztbesteck.","كرة بلّوريّة وأصداف وسحالٍ مجفّفة، ولا أداة طبّيّة واحدة."] },
  truth:["Das Erbe war echt, die Ärztin nicht. Rayhana wollte in Al-Ghubar Fieber „heilen“ – mit Eidechsen.",
         "الإرث حقيقيّ، أمّا الطبيبة فلا. كانت ريحانة تنوي «علاج» الحمّى في الغبار بالسحالي."] },

{ id:"t13", type:"cargo", tier:2, g:"m", p:"dwarf", look:{head:"helmet"}, money:500,
  name:["Kahlan ibn Sanduq","كهلان بن صندوق"], job:["Gewürzhändler","تاجر بهارات"], from:["Dschabal Nuhas","جبل النحاس"], why:["Handel","تجارة"],
  say:["Mein Pass ist alt, ja, älter als mein Bart. Und in den Säcken ist nur Kreuzkümmel. Grauer Kreuzkümmel. Der riecht nach nichts, ganz normal.",
       "جوازي قديم، نعم، أقدم من لحيتي. وفي الأكياس كمّون فقط. كمّون رماديّ لا رائحة له، شيء عاديّ جدًّا."],
  f:{ seal:[0,"Siegel 40 Jahre alt und verblasst – aber noch gültig. Zwergenpässe laufen nie ab.","الختم عمره 40 سنة وباهت، لكنّه ما زال ساريًا. جوازات الأقزام لا تنتهي صلاحيّتها."],
      wealth:[-1,"480 Dinar. Passt.","480 دينار. مطابق."],
      papers:[-1,"Register: Gewürzhändler, seit Jahrzehnten unauffällig.","السجلّ: تاجر بهارات، بلا سوابق منذ عقود."],
      cargo:[1,"Der „graue Kreuzkümmel“ ist Schwarzpulver. Genug, um die Schranke bis nach Bagdad zu blasen.","«الكمّون الرماديّ» بارود أسود، يكفي لنسف الحاجز حتّى بغداد."] },
  truth:["Der alte Pass war harmlos. Kreuzkümmel, der nach nichts riecht, ist es nicht.",
         "الجواز القديم لم يكن مشكلة. أمّا الكمّون الذي لا رائحة له فهو المشكلة."] },

{ id:"t14", type:"honest", tier:2, g:"m", p:"giant", look:{head:"skullcap"}, money:90,
  name:["Ghaith Abu Jabal","غيث أبو جبل"], job:["Kamelführer","جمّال"], from:["Wadi al-Milh","وادي الملح"], why:["Arbeit","عمل"],
  say:["Ich bin Lastenträger, kein Kamelmann. Kamele zappeln. In meinem Bündel ist nur ein bisschen Kleidung – nicht viel, wirklich.",
       "أنا حمّال ولست جمّالًا، فالجِمال كثيرة التململ. وفي صُرّتي قليل من الثياب، ليس كثيرًا، صدّقني."],
  f:{ seal:[-1,"Echt. Mit einem riesigen Daumenabdruck.","أصليّ، وعليه بصمة إبهام عملاقة."],
      wealth:[-1,"90 Dinar. Stimmt.","90 دينار. مطابق."],
      papers:[0,"Akte: „Kamelführer“. Register: Lastenträger. Der Torschreiber hat sich verschrieben.","في الملفّ «جمّال» وفي السجلّ «حمّال»: نقطة سقطت من قلم كاتب البوّابة."],
      cargo:[0,"Ein Bündel so groß wie eine Hütte. Darin: Hemden in Riesengröße. Für einen Dünenriesen ist das wenig.","صُرّة بحجم كوخ، فيها قمصان بمقاس العمالقة. وهذا قليل بمقياس عمالقة الكثبان."] },
  truth:["Ghaith ist sauber. Ein verschriebener Beruf und ein Bündel, das nur für Menschen riesig ist – beides harmlos.",
         "غيث نظيف. مهنة كُتبت خطأً، وصُرّة لا تبدو ضخمة إلّا للبشر، وكلاهما لا يضرّ."] },

{ id:"t15", type:"seal", tier:2, g:"f", p:"gobold", look:{head:"scarf"}, money:200,
  name:["Shaqshaqa bint Qurqur","شقشقة بنت قرقر"], job:["Kamelzüchterin","مربّية جِمال"], from:["Bir al-Sahra","بئر الصحراء"], why:["Kamel verkaufen","بيع جمل"],
  say:["Ich züchte Kamele und treibe sie auch – wer soll es sonst tun? Den Stempel hat mir ein netter Mann am Brunnen gemacht. Er hatte einen eigenen Adler. Aus Rübe.",
       "أنا أربّي الجِمال وأسوقها أيضًا، فمن غيري يفعل؟ أمّا الختم فصنعه لي رجل لطيف عند البئر، كان لديه نسر خاصّ به… منحوت من اللفت."],
  f:{ seal:[1,"Siegel mit einer Rübe gedruckt. Man sieht noch die Fasern. Fälschung.","الختم مطبوع بحبّة لفت، وما زالت أليافها ظاهرة. مزوَّر."],
      wealth:[-1,"195 Dinar. Passt.","195 دينار. مطابق."],
      papers:[0,"Register: Kameltreiberin. Akte: Kamelzüchterin. Bei Gobolden ist das dasselbe.","السجلّ: سائقة جِمال، والملفّ: مربّية جِمال. عند الغوبولد هما شيء واحد."],
      cargo:[-1,"Ein Sack Kamelfutter und ein Kamel, das dich anspuckt.","كيس علف وجمل يبصق عليك."] },
  truth:["Züchterin oder Treiberin – egal. Ein Adler aus Rübe ist es nicht.",
         "مربّية أو سائقة، لا فرق. أمّا النسر المنحوت من اللفت فهو الفرق كلّه."] },

{ id:"t16", type:"clean", tier:2, g:"m", p:"human", look:{head:"skullcap"}, money:250,
  name:["Salim al-Hawari","سالم الحواري"], job:["Oud-Spieler","عازف عود"], from:["Bagdad","بغداد"], why:["Hochzeit","عرس"],
  say:["Ich spiele auf einer Hochzeit in Al-Ghubar. Die Braut kenne ich nicht, den Bräutigam auch nicht – ich kenne nur das Honorar. In der Kiste ist meine Oud. Und ein Säbel, für den Tanz.",
       "سأعزف في عرس في الغبار. لا أعرف العروس ولا العريس، أعرف الأجرة فقط. في الصندوق عودي… وسيف للرقص."],
  f:{ seal:[-1,"Echt. Am Rand stehen Notenlinien.","أصليّ، وعلى حافّته سطور نوتة موسيقيّة."],
      wealth:[-1,"250 Dinar – genau das Honorar.","250 دينار، وهي الأجرة نفسها."],
      papers:[-1,"Register: Oud-Spieler, Hochzeitsvertrag mit dem Siegel des Brautvaters.","السجلّ: عازف عود، ومعه عقد العرس مختومًا بختم والد العروس."],
      cargo:[0,"Eine Oud und ein stumpfer Ziersäbel mit Hochzeitsbändern. Erlaubt.","عود وسيف زينة غير حادّ ملفوف بأشرطة العرس. مسموح."] },
  truth:["Ein Musiker, der das Brautpaar nicht kennt, ist normal. Ein Säbel mit Hochzeitsbändern auch. Salim war sauber.",
         "عازف لا يعرف العروسين أمر طبيعيّ، وسيف ملفوف بأشرطة العرس كذلك. كان سالم نظيفًا."] },

{ id:"t17", type:"bribe", tier:2, g:"m", p:"dwarf", look:{head:"helmet"}, money:100,
  name:["Ghudran ibn Mitraqa","غُدران بن مطرقة"], job:["Schmied","حدّاد"], from:["Qasr ar-Rimal","قصر الرمال"], why:["Werkzeug verkaufen","بيع العُدّة"],
  say:["Geboren bin ich in Dschabal Nuhas, aber ich wohne seit Jahren in Qasr ar-Rimal. Hundert Dinar, mehr nicht. Und falls der Stempel etwas schneller geht, findet sich vielleicht noch etwas.",
       "وُلدت في جبل النحاس، لكنّي أسكن قصر الرمال منذ سنين. معي مئة دينار، لا أكثر. وإن أسرعتَ بالختم قليلًا، فقد يظهر شيء آخر."],
  f:{ seal:[-1,"Echt, mit Rußspuren vom Schmiedefeuer.","أصليّ، وعليه آثار سُخام من الكير."],
      wealth:[1,"Im hohlen Hammerstiel: 3200 Dinar. Angegeben: 100.","في مقبض المطرقة المجوَّف: 3200 دينار. المصرَّح به: 100."],
      papers:[0,"Register: geboren in Dschabal Nuhas, Wohnsitz Qasr ar-Rimal. Beides stimmt.","السجلّ: مولود في جبل النحاس، ومقيم في قصر الرمال. كلاهما صحيح."],
      cargo:[0,"Zangen, Hufeisen und ein auffällig schwerer Hammer.","كمّاشات وحدوات، ومطرقة ثقيلة على نحو لافت."] },
  truth:["Zwei Orte im Lebenslauf sind kein Verbrechen. „Findet sich vielleicht noch etwas“ schon.",
         "مكانان في سيرة الحياة ليسا جريمة. أمّا «قد يظهر شيء آخر» فجريمة."] },

{ id:"t18", type:"cargo", tier:2, g:"f", p:"giant", look:{head:"scarf"}, money:40,
  name:["Hind Umm Sakhr","هند أمّ صخر"], job:["Wasserträgerin","سقّاءة"], from:["Wadi al-Milh","وادي الملح"], why:["Wasser liefern","توصيل الماء"],
  say:["Aus Wadi al-Milh bringe ich das süßeste Wasser der Wüste. Dass es ein bisschen nach Lampenöl riecht, liegt am Tank. Bitte keine Fackel in die Nähe halten.",
       "أحمل من وادي الملح أعذب ماء في الصحراء. وإن كانت رائحته تشبه زيت المصابيح قليلًا فالذنب ذنب الخزّان. أرجوك، لا تقرّب منه مشعلًا."],
  f:{ seal:[-1,"Echt, etwas feucht.","أصليّ، ورطب قليلًا."],
      wealth:[-1,"40 Dinar. Passt.","40 دينار. مطابق."],
      papers:[0,"Register: In Wadi al-Milh gibt es tatsächlich eine Süßwasserquelle. Ironie der Erdkunde.","السجلّ: في وادي الملح عين ماء عذب فعلًا. من مفارقات الجغرافيا."],
      cargo:[1,"In den Tanks: Brandöl. Ein Funke, und Al-Ghubar hat ein neues Lagerfeuer.","في الخزّانات زيت حارق. شرارة واحدة وتصير الغبار كلّها موقدًا."] },
  truth:["Süßwasser im Salztal gibt es wirklich. Wasser, von dem man Fackeln fernhalten muss, nicht.",
         "الماء العذب في وادي الملح موجود حقًّا. أمّا ماء يجب إبعاد المشاعل عنه فلا وجود له."] },

{ id:"t19", type:"identity", tier:2, g:"m", p:"gobold", look:{head:"tarboosh"}, money:300,
  name:["Khunfus al-Kabir","خُنفُس الكبير"], job:["Steuereintreiber","جابي ضرائب"], from:["Suq al-Qamar","سوق القمر"], why:["Steuern eintreiben","جباية الضرائب"],
  say:["Ich bin Steuereintreiber, ganz offiziell. In meiner Tasche ist ein Käfig mit einer Maus – sie zählt die Münzen. Wie viel Steuer zahlt man eigentlich für ein Kamel? Ich frage für einen Freund.",
       "أنا جابي ضرائب، رسميًّا تمامًا. في حقيبتي قفص فيه فأر يعدّ لي النقود. بالمناسبة، كم ضريبة الجمل؟ أسأل لصديق."],
  f:{ seal:[-1,"Echt. Der Pass selbst ist in Ordnung.","أصليّ. الجواز نفسه سليم."],
      wealth:[-1,"300 Dinar. Passt.","300 دينار. مطابق."],
      papers:[1,"Register: kein Steuereintreiber dieses Namens. Gesucht wegen falscher Steuerquittungen in drei Basaren.","السجلّ: لا يوجد جابي ضرائب بهذا الاسم. مطلوب بتهمة تزوير إيصالات الضرائب في ثلاثة أسواق."],
      cargo:[0,"Ein Käfig mit einer Maus. Sie zählt tatsächlich. Bis drei.","قفص فيه فأر يعدّ فعلًا… حتّى ثلاثة."] },
  truth:["Eine zählende Maus ist seltsam, aber erlaubt. Ein Steuereintreiber, der nach der Kamelsteuer fragt, ist keiner.",
         "فأر يعدّ أمر غريب لكنّه مسموح. أمّا جابي ضرائب يسأل عن ضريبة الجمل فليس جابيًا."] },

/* ---------------- STUFE 3: drei Widersprüche, Aussage passt nicht zur Akte ---------------- */
{ id:"t20", type:"identity", tier:3, g:"m", p:"human", look:{head:"keffiyeh"}, money:800,
  name:["Nasir al-Wazzan","ناصر الوزّان"], job:["Brückenbauer","بنّاء جسور"], from:["Mosul","الموصل"], why:["Brücke prüfen","معاينة جسر"],
  say:["Brücken? Ich hasse Wasser, schon als Kind. Ich bin wegen des großen Kamelrennens hier. Die achthundert Dinar sind mein Einsatz – mein Kamel ist schnell, nur leider ein bisschen faul.",
       "الجسور؟ أكره الماء منذ طفولتي. جئت من أجل سباق الهجن الكبير. والثمانمئة دينار رهاني، فجملي سريع، لكنّه كسول بعض الشيء للأسف."],
  f:{ seal:[-1,"Echt – es ist ja auch ein echter Pass. Nur eben von jemand anderem.","أصليّ، فهو جواز حقيقيّ… لكنّه لشخص آخر."],
      wealth:[0,"800 Dinar, ein Wettschein liegt bei. Viel, aber nicht verboten.","800 دينار، ومعها إيصال رهان. مبلغ كبير لكنّه غير محظور."],
      papers:[1,"Register: Der echte Brückenbauer Nasir al-Wazzan ist 70 und sitzt in Mosul. Dieser hier ist sein Neffe, ein Kamelreiter.","السجلّ: بنّاء الجسور الحقيقيّ ناصر الوزّان عمره 70 عامًا ويقيم في الموصل. أمّا هذا فابن أخيه، راكب هجن."],
      cargo:[0,"Ein Rennsattel, eine Peitsche aus Palmblatt, kein einziges Messwerkzeug.","سرج سباق وسوط من سعف النخيل، ولا أداة قياس واحدة."] },
  truth:["Der Pass ist echt, gehört aber seinem Onkel. Ein Brückenbauer, der Wasser hasst und Kamelrennen reitet – Aussage und Akte passten nie zusammen.",
         "الجواز أصليّ لكنّه لعمّه. بنّاء جسور يكره الماء ويركب الهجن؟ لم تتطابق أقواله مع ملفّه قطّ."] },

{ id:"t21", type:"cargo", tier:3, g:"f", p:"dwarf", look:{head:"braids"}, money:260,
  name:["Durra bint Hadid","دُرّة بنت حديد"], job:["Töpferin","خزّافة"], from:["Dschabal Nuhas","جبل النحاس"], why:["Handel","تجارة"],
  say:["Ich komme zur Hochzeit meiner Tochter, nicht zum Handeln – na gut, ein paar Krüge verkaufe ich nebenbei. Den Pass habe ich in Mosul machen lassen, da ist die Schlange kürzer. Die Krüge sind leer. Auch die schweren. Besonders die schweren.",
       "جئت لعرس ابنتي لا للتجارة… حسنًا، سأبيع بعض الجِرار على الهامش. استخرجت جوازي في الموصل لأنّ الطابور هناك أقصر. الجِرار فارغة، حتّى الثقيلة منها. خصوصًا الثقيلة."],
  f:{ seal:[0,"Ausgestellt in Mosul, am Zwergenschalter. Ungewöhnlich, aber gültig.","صادر في الموصل من شبّاك الأقزام. غير معتاد، لكنّه ساري المفعول."],
      wealth:[-1,"255 Dinar. Passt.","255 دينار. مطابق."],
      papers:[0,"Register: Töpferin. Eine Hochzeitseinladung liegt bei. Handel und Hochzeit schließen sich nicht aus.","السجلّ: خزّافة، ومعها دعوة عرس. التجارة والعرس لا يتعارضان."],
      cargo:[1,"Die schweren Krüge sind voller Silberbarren aus der verbotenen Mine von Dschabal Nuhas.","الجِرار الثقيلة مملوءة بسبائك فضّة من المنجم المحظور في جبل النحاس."] },
  truth:["Hochzeit statt Handel und ein Pass aus Mosul – alles harmlos. Leere Krüge, die schwer sind, nie.",
         "العرس بدل التجارة وجواز من الموصل: لا ضرر في ذلك. أمّا جِرار فارغة وثقيلة فهذا لا يكون أبدًا."] },

{ id:"t22", type:"honest", tier:3, g:"m", p:"gobold", look:{head:"hood"}, money:70,
  name:["Bazbuz ibn Fasfus","بزبوز بن فسفوس"], job:["Laternenanzünder","مُشعل الفوانيس"], from:["Tall al-Ghurban","تلّ الغربان"], why:["Arbeit","عمل"],
  say:["Ich zünde Laternen an. Nachts. Also schlafe ich tagsüber, deshalb sehe ich so verdächtig aus. Mein Pass sagt, ich bin zweihundert Jahre alt – stimmt nicht, ich bin erst hundertneunzig. Und das Öl in meiner Kanne ist für die Laternen.",
       "أُشعل الفوانيس ليلًا، ولذلك أنام نهارًا، وهذا سبب منظري المريب. جوازي يقول إنّ عمري مئتا سنة، وهذا غير صحيح، فأنا في المئة والتسعين فقط. أمّا الزيت في إبريقي فللفوانيس."],
  f:{ seal:[0,"Siegel echt. Das Geburtsjahr ist um zehn Jahre verschrieben – bei Gobolden zählt das Amt ungern genau.","الختم أصليّ. سنة الميلاد مكتوبة خطأً بفارق عشر سنين، فالدائرة لا تحبّ العدّ الدقيق مع الغوبولد."],
      wealth:[-1,"70 Dinar. Passt.","70 دينار. مطابق."],
      papers:[-1,"Register: Laternenanzünder in Tall al-Ghurban, Nachtschicht.","السجلّ: مُشعل فوانيس في تلّ الغربان، مناوبة ليليّة."],
      cargo:[0,"Eine Kanne Lampenöl, eine Leiter, ein Docht. Genau so viel, wie ein Laternenanzünder braucht.","إبريق زيت مصابيح وسُلّم وفتيل، بقدر ما يحتاجه مُشعل الفوانيس بالضبط."] },
  truth:["Verschlafen, falsches Geburtsjahr, eine Kanne Öl – Bazbuz sieht schlimmer aus, als er ist. Sauber.",
         "نعسان، وسنة ميلاد خاطئة، وإبريق زيت… منظر بزبوز أسوأ من حقيقته. إنّه نظيف."] },

{ id:"t23", type:"bribe", tier:3, g:"f", p:"human", look:{head:"scarf"}, money:400,
  name:["Safiyya al-Bazzaza","صفيّة البزّازة"], job:["Stoffhändlerin","بائعة أقمشة"], from:["Bagdad","بغداد"], why:["Handel","تجارة"],
  say:["Ich verkaufe Stoffe, vor allem Seide. Vierhundert Dinar, wie in der Akte. Dieser Seidenschal ist übrigens genau Ihre Farbe – nehmen Sie ihn, und den Knoten darin bitte erst zu Hause öffnen. Meine Karawane ist schon vorausgezogen.",
       "أبيع الأقمشة، والحرير خاصّة. أربعمئة دينار، كما في الملفّ. وهذا الشال الحريريّ بلونك تمامًا على فكرة، خذه، لكن لا تفكّ العقدة التي فيه إلّا في البيت. قافلتي سبقتني."],
  f:{ seal:[-1,"Echt, Bagdader Stempel.","أصليّ، بختم بغداد."],
      wealth:[1,"Im Knoten des Schals: 1500 Dinar. Im Stoffballen: weitere 4000. Angegeben: 400.","في عقدة الشال 1500 دينار، وفي لفّة القماش 4000 أخرى. المصرَّح به: 400."],
      papers:[0,"Register: Ihre Karawane passierte gestern, ordnungsgemäß verzollt.","السجلّ: قافلتها عبرت أمس، ودفعت الجمارك كما ينبغي."],
      cargo:[0,"Seide, Baumwolle und ein auffällig dicker Stoffballen.","حرير وقطن، ولفّة قماش سميكة على نحو لافت."] },
  truth:["Die Karawane war sauber, die Seide auch. Ein Knoten, den man erst zu Hause öffnen soll, war es nicht.",
         "القافلة كانت نظيفة، والحرير كذلك. أمّا عقدة لا تُفكّ إلّا في البيت فلم تكن كذلك."] },

{ id:"t24", type:"seal", tier:3, g:"m", p:"giant", look:{head:"turban"}, money:120,
  name:["Jalmud Abu Ramla","جلمود أبو رملة"], job:["Steinmetz","نحّات حجر"], from:["Qasr ar-Rimal","قصر الرمال"], why:["Brunnenrand bauen","بناء حافّة بئر"],
  say:["Ich bin Steinmetz und baue einen Brunnenrand. Den Pass hat mir das Amt in Bagdad ausgestellt, letzten Monat. In Bagdad war ich nie – das Amt hat ihn mir nach Hause gebracht. Sehr freundlich. Und mein Werkzeug ist klein, weil ich fein arbeite.",
       "أنا نحّات أبني حافّة بئر. جوازي أصدرته دائرة بغداد الشهر الماضي. لم أزر بغداد قطّ، فالدائرة أوصلته إلى بيتي. لطف كبير منها. وعُدّتي صغيرة لأنّي أعمل بدقّة."],
  f:{ seal:[1,"Bagdader Siegel – aber das Amt in Bagdad verschickt keine Pässe. Die Tinte ist Ruß mit Spucke. Fälschung.","ختم بغداد، لكنّ دائرة بغداد لا ترسل الجوازات إلى أحد، والحبر سُخام ممزوج بالبصاق. مزوَّر."],
      wealth:[-1,"120 Dinar. Passt.","120 دينار. مطابق."],
      papers:[-1,"Register: Steinmetz aus Qasr ar-Rimal. Stimmt.","السجلّ: نحّات من قصر الرمال. مطابق."],
      cargo:[0,"Feiner Meißel, kleiner Hammer. Für Riesenhände winzig, aber legal.","إزميل دقيق ومطرقة صغيرة، ضئيلة في يد عملاق لكنّها مسموحة."] },
  truth:["Kleines Werkzeug ist harmlos. Ein Amt, das Pässe nach Hause bringt, gibt es in keinem Land der Welt.",
         "العُدّة الصغيرة لا تضرّ. أمّا دائرة توصل الجوازات إلى البيوت فلا وجود لها في أيّ بلد على وجه الأرض."] },

{ id:"t25", type:"clean", tier:3, g:"f", p:"gobold", look:{head:"scarf"}, money:45,
  name:["Zuqzuqa al-Saghira","زُقزوقة الصغيرة"], job:["Lehrerin","مدرِّسة"], from:["Suq al-Qamar","سوق القمر"], why:["Unterricht","التدريس"],
  say:["Ich unterrichte Gobold-Kinder. Ja, Gobolde können lesen – manche. In meiner Tasche sind zwanzig Schleudern, die habe ich den Kindern abgenommen. Die Akte sagt „Lehrerin“, ich sage „Schulmeisterin“. Das ist dasselbe, nur feiner.",
       "أعلّم أطفال الغوبولد. نعم، الغوبولد يعرفون القراءة… بعضهم. في حقيبتي عشرون مقلاعًا صادرتها من الأطفال. والملفّ يقول «مدرِّسة» وأنا أقول «معلّمة»، وهما شيء واحد، لكنّ الثانية أرقى."],
  f:{ seal:[-1,"Echt. Mit roter Tinte korrigiert.","أصليّ، ومصحَّح بالحبر الأحمر."],
      wealth:[-1,"45 Dinar. Ein Lehrerinnengehalt.","45 دينار. راتب معلّمة."],
      papers:[-1,"Register: Lehrerin an der Gobold-Schule von Suq al-Qamar. Sehr streng, sagen die Akten.","السجلّ: مدرِّسة في مدرسة الغوبولد بسوق القمر. صارمة جدًّا بحسب الملفّات."],
      cargo:[0,"Zwanzig Kinderschleudern, eine Tafel, Kreide. Beschlagnahmt, nicht geschmuggelt.","عشرون مقلاع أطفال ولوح وطباشير. مصادرات مدرسيّة، لا تهريب."] },
  truth:["Schleudern, ein Wortspiel und ein Vorurteil gegen Gobolde – nichts davon ist Korruption. Zuqzuqa war sauber.",
         "مقاليع، وتلاعب بالكلمات، وتحيّز ضدّ الغوبولد… لا شيء من ذلك فساد. كانت زُقزوقة نظيفة."] },

{ id:"t26", type:"cargo", tier:3, g:"m", p:"human", look:{head:"turban"}, money:350,
  name:["Majid al-Saffar","ماجد الصفّار"], job:["Kupferschmied","صفّار"], from:["Basra","البصرة"], why:["Handel","تجارة"],
  say:["Kupferlampen, zwanzig Stück. In der Akte steht Handel, aber eigentlich besuche ich meine Mutter – der Handel ist nur die Ausrede für mein Kamel. Eine Lampe ist zugelötet, die ist kaputt. Nicht öffnen. Die ist … sehr kaputt.",
       "قناديل نحاسيّة، عشرون قنديلًا. في الملفّ مكتوب «تجارة»، لكنّي في الحقيقة أزور أمّي، والتجارة مجرّد حجّة أقنع بها جملي. أحد القناديل ملحوم لأنّه مكسور. لا تفتحه، إنّه… مكسور جدًّا."],
  f:{ seal:[-1,"Echt. Riecht leicht nach Lötzinn.","أصليّ، وتفوح منه رائحة القصدير قليلًا."],
      wealth:[-1,"350 Dinar. Passt.","350 دينار. مطابق."],
      papers:[0,"Register: Kupferschmied. Die Mutter wohnt tatsächlich in Al-Ghubar. Handel und Besuch – beides plausibel.","السجلّ: صفّار، وأمّه تسكن الغبار فعلًا. التجارة والزيارة كلتاهما معقولتان."],
      cargo:[1,"In der zugelöteten Lampe: das gestohlene Amtssiegel des Statthalters von Basra.","داخل القنديل الملحوم: ختم والي البصرة المسروق."] },
  truth:["Dass Majid seine Mutter besucht und sein Kamel belügt, ist seine Sache. Das Siegel des Statthalters in einer zugelöteten Lampe nicht.",
         "أن يزور ماجد أمّه ويكذب على جمله فهذا شأنه. أمّا ختم الوالي داخل قنديل ملحوم فليس شأنه وحده."] },

{ id:"t27", type:"identity", tier:3, g:"f", p:"giant", look:{head:"scarf"}, money:600,
  name:["Ghaliya Umm al-Kuthban","غالية أمّ الكثبان"], job:["Karawanenführerin","دليلة قوافل"], from:["Bir al-Sahra","بئر الصحراء"], why:["Karawane führen","قيادة قافلة"],
  say:["Ich führe Karawanen, seit ich denken kann. Den Weg nach Bagdad? Den kenne ich nicht, aber die Kamele kennen ihn. Sechshundert Dinar Lohn, im Voraus. Und nein, ich habe keinen Kompass – Kompasse lügen.",
       "أقود القوافل منذ أن وعيت على الدنيا. طريق بغداد؟ لا أعرفه، لكنّ الجِمال تعرفه. أجرتي ستّمئة دينار، مقدَّمًا. ولا، ليست معي بوصلة، فالبوصلات تكذب."],
  f:{ seal:[-1,"Echt. Sand aus allen Wüstenwegen klebt daran.","أصليّ، وعليه رمل من كلّ طرق الصحراء."],
      wealth:[0,"600 Dinar mit der Vorschussquittung eines Händlers. Ordentlich.","600 دينار، مع إيصال سُلفة من تاجر. سليم."],
      papers:[1,"Register: Ghaliya führt keine Karawanen – sie überfällt sie. Ein Steckbrief aus Bir al-Sahra liegt bei.","السجلّ: غالية لا تقود القوافل بل تقطع طريقها. ومذكّرة بحث من بئر الصحراء مرفقة."],
      cargo:[0,"Wasserschläuche, ein Seil und ein auffällig großer Krummdolch.","قِرَب ماء وحبل وخنجر معقوف كبير على نحو لافت."] },
  truth:["Kein Kompass und Lohn im Voraus – harmlos. Eine Führerin, die den Weg nicht kennt, ist keine: Ghaliya überfällt Karawanen, statt sie zu führen.",
         "لا بوصلة، وأجرة مقدَّمة: لا ضرر. أمّا دليلة لا تعرف الطريق فليست دليلة؛ غالية تقطع طريق القوافل بدل أن تقودها."] },

/* ---------------- STUFE 4: vier Widersprüche, unschuldig wirkende Saubere ---------------- */
{ id:"t28", type:"clean", tier:4, g:"m", p:"gobold", mood:"nervous", look:{head:"none"}, money:0,
  name:["Shunshun ibn Hafi","شنشون بن حافي"], job:["Tagelöhner","عامل مياومة"], from:["Tall al-Ghurban","تلّ الغربان"], why:["Arbeit suchen","البحث عن عمل"],
  say:["Ich … ich habe nichts. Null Dinar. Wirklich null. Ich schwitze nur, weil es heiß ist – und weil Sie so schauen. Die Beule im Sack ist ein Brot. Ein altes. Mein Pass ist geknickt, ich habe darauf geschlafen. Bitte. Ich will nur arbeiten.",
       "أنا… لا أملك شيئًا. صفر دينار. صفر حقًّا. أتعرّق لأنّ الجوّ حارّ… ولأنّك تنظر إليّ هكذا. الانتفاخ في الكيس رغيف خبز، قديم. جوازي مطويّ لأنّي نمت عليه. أرجوك، أريد أن أعمل فقط."],
  f:{ seal:[0,"Pass zerknittert, das Siegel aber echt und lesbar.","الجواز مجعَّد، لكنّ الختم أصليّ ومقروء."],
      wealth:[-1,"0 Dinar. Nicht einmal ein Knopf. Ehrlich angegeben.","0 دينار، ولا حتّى زرّ. التصريح صادق."],
      papers:[-1,"Register: Tagelöhner ohne Vorstrafen. Ein Arbeitgeber in Al-Ghubar bestätigt.","السجلّ: عامل مياومة بلا سوابق، وصاحب عمل في الغبار يؤكّد ذلك."],
      cargo:[0,"Ein steinhartes Brot. Man könnte damit eine Tür einschlagen, aber es ist kein Werkzeug.","رغيف يابس كالحجر، يمكن كسر باب به، لكنّه ليس أداة."] },
  truth:["Arm, nervös, verschwitzt, mit zerknittertem Pass – Shunshun sieht aus wie ein Schmuggler aus dem Bilderbuch. Er ist nur ein armer Kerl, der Arbeit sucht.",
         "فقير ومتوتّر ومتعرّق وجوازه مجعَّد: شنشون يبدو كمهرّب خرج من كتاب مصوَّر، لكنّه مجرّد مسكين يبحث عن عمل."] },

{ id:"t29", type:"clean", tier:4, g:"f", p:"giant", look:{head:"hood", cloth:"#6d7f96"}, money:900,
  name:["Thalja bint Barad","ثلجة بنت برد"], job:["Eishändlerin","بائعة ثلج"], from:["Dschabal al-Thaldsch","جبل الثلج"], why:["Eis verkaufen","بيع الثلج"],
  say:["Ich verkaufe Eis. In der Wüste. Ja, ich weiß. Meine Kisten tropfen, mein Pass ist nass, und ich spreche Ihre Sprache schlecht, Entschuldigung. Neunhundert Dinar, oder achthundert – das Eis schmilzt, das Geld auch.",
       "أبيع الثلج. في الصحراء. نعم، أعرف. صناديقي تقطر، وجوازي مبلول، ولغتي ضعيفة، اعذرني. تسعمئة دينار، أو ثمانمئة؛ الثلج يذوب، والمال كذلك."],
  f:{ seal:[0,"Siegel nass und verlaufen, aber das Wasserzeichen ist echt.","الختم مبلول وحبره سائل، لكنّ العلامة المائيّة أصليّة."],
      wealth:[0,"850 Dinar – genau zwischen ihren beiden Angaben. Bei schmelzendem Eis verständlich.","850 دينار، بين الرقمين اللذين ذكرتهما. أمر مفهوم مع ثلج يذوب."],
      papers:[-1,"Register: Eishändlerin mit Lizenz für den Wüstenhandel. Ja, so etwas gibt es.","السجلّ: بائعة ثلج، ولها رخصة للتجارة في الصحراء. نعم، هذه موجودة."],
      cargo:[-1,"Eisblöcke in Stroh. Nur Eis. Herrlich kühl.","قوالب ثلج في القشّ. ثلج فقط، ويا له من برد منعش."] },
  truth:["Ein fremdes Volk, ein nasser Pass, eine schwankende Summe – alles verdächtig, nichts verboten. Thalja verkauft wirklich Eis in der Wüste. Mutig, nicht korrupt.",
         "قوم غرباء، وجواز مبلول، ومبلغ متأرجح: كلّه مريب، ولا شيء منه ممنوع. ثلجة تبيع الثلج في الصحراء فعلًا. جريئة، لا فاسدة."] },

{ id:"t30", type:"bribe", tier:4, g:"m", p:"human", look:{head:"turban"}, money:200,
  name:["Rafiq al-Tahhan","رفيق الطحّان"], job:["Müller","طحّان"], from:["Mosul","الموصل"], why:["Mehl liefern","توصيل الطحين"],
  say:["Ich bin Müller, drei Mühlen, sie laufen gut. Zweihundert Dinar, Mehl in den Säcken, alles wie immer. Mein Pass ist neu – der alte ist in den Mühlstein geraten. Und mein Bruder, der Hauptmann der Garnison, lässt Sie grüßen. Er sagt, Sie sind ein vernünftiger Mann.",
       "أنا طحّان أملك ثلاث مطاحن تعمل جيّدًا. معي مئتا دينار، وفي الأكياس طحين، وكلّ شيء كالمعتاد. جوازي جديد لأنّ القديم وقع تحت حجر الرحى. وأخي، قائد الحامية، يبلّغك سلامه. يقول إنّك رجل عاقل."],
  f:{ seal:[0,"Neuer Pass, echtes Siegel, Ersatz wegen „Mühlsteinschaden“ vermerkt.","جواز جديد بختم أصليّ، ومدوَّن عليه أنّه بدل تالف «بسبب حجر الرحى»."],
      wealth:[1,"Im Mehl versteckt: Goldmünzen für 7000 Dinar – und ein Zettel: „Für den vernünftigen Mann.“ Angegeben: 200.","مخبّأة في الطحين: نقود ذهبيّة بقيمة 7000 دينار، وورقة كُتب عليها: «للرجل العاقل». المصرَّح به: 200."],
      papers:[0,"Register: Müller mit drei Mühlen. Der Bruder ist tatsächlich Hauptmann – das macht nichts besser, aber auch nichts schlimmer.","السجلّ: طحّان له ثلاث مطاحن، وأخوه قائد الحامية فعلًا. وهذا لا يحسّن شيئًا ولا يسيئه."],
      cargo:[0,"Mehlsäcke. Auffällig schwer für Mehl.","أكياس طحين، ثقيلة على غير عادة الطحين."] },
  truth:["Ein neuer Pass und ein Bruder mit Rang sind kein Verbrechen. Gold im Mehl „für den vernünftigen Mann“ schon.",
         "الجواز الجديد والأخ ذو الرتبة ليسا جريمة. أمّا الذهب في الطحين «للرجل العاقل» فجريمة."] },

{ id:"t31", type:"seal", tier:4, g:"f", p:"human", look:{head:"scarf"}, money:350,
  name:["Lamis bint Ziyad","لميس بنت زياد"], job:["Kalligrafin","خطّاطة"], from:["Bagdad","بغداد"], why:["Ausstellung","معرض خطّ"],
  say:["Ich bin Kalligrafin und zeige meine Schriften in Al-Ghubar – sie reisen mit einer anderen Karawane. Tinte an den Fingern? Berufskrankheit. Das Siegel ist etwas blass, das Amt spart an Tinte. Dreihundertfünfzig Dinar. Und bitte nicht mit dem Daumen über das Siegel reiben, es ist empfindlich.",
       "أنا خطّاطة، وسأعرض لوحاتي في الغبار؛ وهي تسافر مع قافلة أخرى. حبر على أصابعي؟ داء المهنة. الختم باهت قليلًا لأنّ الدائرة تقتصد في الحبر. معي ثلاثمئة وخمسون دينارًا. وأرجوك لا تفرك الختم بإبهامك، فهو حسّاس."],
  f:{ seal:[1,"Das Siegel verwischt unter dem Daumen. Frische Tusche, meisterhaft gezogen – von ihr selbst. Fälschung.","الختم يسيل تحت الإبهام. حبر طازج بخطّ متقن… بيدها هي. مزوَّر."],
      wealth:[-1,"350 Dinar. Passt.","350 دينار. مطابق."],
      papers:[-1,"Register: Kalligrafin, Ausstellung angemeldet, die zweite Karawane ist gemeldet.","السجلّ: خطّاطة، والمعرض مسجَّل، والقافلة الثانية مُبلَّغ عنها."],
      cargo:[0,"Rohrfedern, Tusche, Blattgold und ein kleines Messer zum Anspitzen.","أقلام قصب وحبر ورقائق ذهب وسكّين صغيرة للبري."] },
  truth:["Tinte an den Fingern ist für eine Kalligrafin normal – auf einem echten Siegel nicht. Lamis hatte den Pass selbst „verschönert“, weil ihr echter abgelaufen war.",
         "الحبر على أصابع الخطّاطة أمر طبيعيّ، أمّا على ختم حقيقيّ فلا. كانت لميس قد «جمّلت» الجواز بنفسها لأنّ جوازها الحقيقيّ انتهت صلاحيّته."] },

{ id:"t32", type:"honest", tier:4, g:"m", p:"dwarf", mood:"nervous", look:{head:"turban"}, money:500,
  name:["Tamir ibn Dibs","تامر بن دبس"], job:["Zuckerbäcker","حلوانيّ"], from:["Dschabal Nuhas","جبل النحاس"], why:["Begräbnis","عزاء"],
  say:["Hochzeit! Ich backe für eine Hochzeit. Was? In der Akte steht Begräbnis? Bei meinem Bart, nein! Die Kiste ist so schwer, weil tausend Kleicha drin sind. Das Messer ist zum Schneiden – vom Teig! Fünfhundert Dinar Anzahlung, ich schwöre.",
       "عرس! أخبز الحلويات لعرس. ماذا؟ في الملفّ مكتوب «عزاء»؟ لا، وحقّ لحيتي! الصندوق ثقيل لأنّ فيه ألف كليجة. والسكّين للتقطيع… تقطيع العجين! معي خمسمئة دينار عربونًا، أقسم لك."],
  f:{ seal:[-1,"Echt. Mit einem Fingerabdruck aus Dattelsirup.","أصليّ، وعليه بصمة إصبع من الدبس."],
      wealth:[0,"500 Dinar mit der Anzahlungsquittung der Brautfamilie. Viel für einen Bäcker, aber belegt.","500 دينار، مع إيصال العربون من أهل العروس. كثير على حلوانيّ، لكنّه موثَّق."],
      papers:[0,"Register: Hochzeitsauftrag. Der Torschreiber hat das Kästchen daneben angekreuzt – „Begräbnis“. Schlamperei, kein Betrug.","السجلّ: طلبيّة عرس. كاتب البوّابة أشّر على الخانة المجاورة: «عزاء». إهمال، لا احتيال."],
      cargo:[-1,"Tausend Kleicha und ein Teigmesser. Du hast eine probiert: ausgezeichnet.","ألف كليجة وسكّين عجين. تذوّقتَ واحدة: ممتازة."] },
  truth:["Nervös, schwere Kiste, ein Messer und „Begräbnis“ statt Hochzeit – und doch nur ein Bäcker mit einem schlampigen Torschreiber. Tamir war sauber.",
         "متوتّر، وصندوق ثقيل، وسكّين، و«عزاء» بدل العرس… ومع ذلك ليس إلّا حلوانيًّا ابتُلي بكاتب مهمل. كان تامر نظيفًا."] },

{ id:"t33", type:"cargo", tier:4, g:"m", p:"gobold", look:{head:"strawhat"}, money:180,
  name:["Qarqash ibn Bishr","قرقاش بن بِشر"], job:["Imker","نحّال"], from:["Suq al-Qamar","سوق القمر"], why:["Honig verkaufen","بيع العسل"],
  say:["Honig, nur Honig! Roter Honig, eine Spezialität aus Suq al-Qamar. Die Bienen sind zu Hause geblieben, die mögen keine Grenzen. Ja, die Fässer summen ein bisschen – das ist das Echo. Mein Pass läuft ab? Ja, morgen. Heute ist er noch gut.",
       "عسل، عسل فقط! عسل أحمر من خصائص سوق القمر. النحل بقي في البيت، فهو لا يحبّ الحدود. نعم، البراميل تطنّ قليلًا، إنّه الصدى. جوازي تنتهي صلاحيّته؟ نعم، غدًا. أمّا اليوم فما زال صالحًا."],
  f:{ seal:[0,"Siegel echt, läuft morgen ab. Heute gültig.","الختم أصليّ، وتنتهي صلاحيّته غدًا. ساري المفعول اليوم."],
      wealth:[-1,"180 Dinar. Passt.","180 دينار. مطابق."],
      papers:[0,"Register: Imker. Roter Honig ist tatsächlich eine Spezialität aus Suq al-Qamar.","السجلّ: نحّال، والعسل الأحمر من خصائص سوق القمر فعلًا."],
      cargo:[1,"In zwei Fässern: lebende Wüstenhornissen, abgerichtet für Überfälle auf Karawanen. Das „Echo“ sticht.","في برميلين: دبابير صحراويّة حيّة مدرَّبة على مهاجمة القوافل. و«الصدى» يلسع."] },
  truth:["Roter Honig und ein Pass, der morgen abläuft – harmlos. Fässer, die summen, obwohl die Bienen zu Hause sind, nicht.",
         "العسل الأحمر وجواز ينتهي غدًا: لا ضرر. أمّا براميل تطنّ والنحل في البيت فهنا الضرر."] },

{ id:"t34", type:"identity", tier:4, g:"f", p:"human", look:{head:"scarf"}, money:150,
  name:["Badriyya al-Sharqawi","بدريّة الشرقاوي"], job:["Botin","ساعية بريد"], from:["Basra","البصرة"], why:["Briefe zustellen","توصيل الرسائل"],
  say:["Ich bin Botin und bringe Briefe nach Al-Ghubar. Aufgewachsen bin ich in Bagdad, auch wenn die Akte Basra sagt. Lesen kann ich die Briefe nicht, das muss ich auch nicht. Den für den Kommandanten habe ich selbst mit seinem Siegel verschlossen, damit nichts verloren geht. Mein Esel heißt Barq. Er ist langsam.",
       "أنا ساعية بريد، أحمل الرسائل إلى الغبار. نشأت في بغداد وإن كان الملفّ يقول البصرة. لا أقرأ الرسائل، ولا حاجة بي إلى ذلك. أمّا رسالة القائد فقد ختمتها بنفسي بختمه حتّى لا يضيع منها شيء. حماري اسمه برق، وهو بطيء."],
  f:{ seal:[0,"Passsiegel echt. Das Porträt im Pass zeigt allerdings eine deutlich ältere Frau.","ختم الجواز أصليّ، لكنّ الصورة فيه لامرأة أكبر سنًّا بوضوح."],
      wealth:[-1,"150 Dinar. Passt.","150 دينار. مطابق."],
      papers:[1,"Register: keine Botin dieses Namens. Steckbrief: Spionin der Sandbanditen, benutzt gestohlene Siegel.","السجلّ: لا ساعية بريد بهذا الاسم. مذكّرة بحث: جاسوسة لعصابة الرمال، تستعمل أختامًا مسروقة."],
      cargo:[0,"Ein Bündel Briefe. Einer trägt das Siegel des Kommandanten – das Wachs ist noch warm.","رزمة رسائل، إحداها بختم القائد… والشمع ما زال دافئًا."] },
  truth:["Bagdad statt Basra, ein langsamer Esel, eine Botin, die nicht liest – alles harmlos. Aber Boten versiegeln keine Briefe mit fremden Siegeln. Badriyya spioniert für die Sandbanditen.",
         "بغداد بدل البصرة، وحمار بطيء، وساعية لا تقرأ: كلّه لا يضرّ. لكنّ السُّعاة لا يختمون الرسائل بأختام غيرهم. بدريّة تتجسّس لعصابة الرمال."] },

{ id:"t35", type:"clean", tier:4, g:"m", p:"giant", mood:"nervous", look:{head:"hood", cloth:"#7a6a58"}, money:5,
  name:["Ra'd ibn Ghamam","رعد بن غمام"], job:["Brunnenputzer","منظّف آبار"], from:["Jenseits des Salzmeers","ما وراء بحر الملح"], why:["Neuanfang","بداية جديدة"],
  say:["Ich komme von jenseits des Salzmeers. Bei uns gibt es keine Pässe, nur Namen – dieser hier ist mein erster. Fünf Dinar habe ich. Ich bin groß, aber ich tue niemandem etwas. Meine Hände zittern, weil ich seit drei Tagen nichts gegessen habe. In der Kiste ist der Kochtopf meiner Mutter. Mehr besitze ich nicht.",
       "جئت من وراء بحر الملح. عندنا لا جوازات، بل أسماء فقط، وهذا أوّل جواز في حياتي. معي خمسة دنانير. أنا ضخم، لكنّي لا أؤذي أحدًا. يداي ترتجفان لأنّي لم آكل منذ ثلاثة أيّام. في الصندوق قِدر أمّي، ولا أملك غيرها."],
  f:{ seal:[-1,"Brandneuer Pass, echtes Siegel, ausgestellt am Schalter für Neuankömmlinge.","جواز جديد تمامًا بختم أصليّ، صادر من شبّاك القادمين الجدد."],
      wealth:[-1,"5 Dinar. Ehrlich bis auf den letzten Fils.","5 دينار. التصريح صادق حتّى آخر فِلس."],
      papers:[0,"Register: neu eingetragen. Ein Brunnenmeister in Al-Ghubar bürgt für ihn und sucht kräftige Hände.","السجلّ: مسجَّل حديثًا، ويكفله معلّم آبار في الغبار يبحث عن أيدٍ قويّة."],
      cargo:[-1,"Ein verbeulter Kochtopf. Darin: ein Rezept in Riesenschrift.","قِدر مُعوجّة، فيها وصفة طبخ بخطّ عملاق."] },
  truth:["Fremd, riesig, arm, zitternd und ohne alten Pass – Ra'd hat jeden Grund, verdächtig zu wirken, und keinen, abgewiesen zu werden.",
         "غريب وضخم وفقير ومرتجف وبلا جواز قديم: لدى رعد كلّ الأسباب ليبدو مريبًا، ولا سبب واحد لرفضه."] },

/* ---------------- STUFE 5: korrupte Vorgesetzte & harte Fälle ---------------- */
{ id:"t36", type:"boss", tier:5, g:"m", p:"human", look:{head:"cap", beard:0, mustache:2}, money:400,
  name:["Kazim al-Hadidi","كاظم الحديدي"], job:["Oberinspektor des Grenzamts","كبير مفتّشي دائرة الحدود"], from:["Bagdad","بغداد"], why:["Dienstreise","مهمّة رسميّة"],
  say:["Ich bin Ihr Vorgesetzter, mein Junge, also machen wir es kurz. Ich habe in meinem Leben nie einen einzigen Dinar Bakschisch angenommen. Das Haus am Fluss und die drei Kamele habe ich mir von meinem Gehalt gekauft – vierzig Dinar im Monat, wie bei Ihnen. Man muss eben sparen.",
       "أنا رئيسك يا بنيّ، فلنختصر. لم أقبل في حياتي دينارًا واحدًا رشوة. البيت على النهر والجِمال الثلاثة اشتريتها من راتبي: أربعون دينارًا في الشهر، مثلك تمامًا. المسألة مسألة توفير."],
  f:{ seal:[-1,"Siegel makellos. Doppelt geprüft, dreifach gestempelt.","الختم بلا عيب، مدقَّق مرّتين ومختوم ثلاثًا."],
      wealth:[-1,"400 Dinar im Beutel. Genau wie angegeben.","400 دينار في الكيس، كما صرّح تمامًا."],
      papers:[-1,"Register: Oberinspektor, Dienstreise genehmigt. Die Akte glänzt fast.","السجلّ: كبير المفتّشين، ومهمّته الرسميّة معتمدة. الملفّ يكاد يلمع."],
      cargo:[0,"Ein Aktenkoffer. Darin: ein Rechnungsbuch mit zwei Spalten, „offiziell“ und „Tee“.","حقيبة أوراق، فيها دفتر حسابات بعمودين: «رسميّ» و«شاي»."] },
  truth:["Von vierzig Dinar im Monat kauft niemand ein Haus am Fluss und drei Kamele. Kazim widersprach sich selbst – seine Akten sind sauber, weil er sie selbst führt.",
         "لا أحد يشتري بيتًا على النهر وثلاثة جِمال من راتب أربعين دينارًا في الشهر. ناقض كاظم نفسه، وملفّاته نظيفة لأنّه هو من يكتبها."] },

{ id:"t37", type:"boss", tier:5, g:"f", p:"human", look:{head:"scarf", boss:true}, money:250,
  name:["Nadira bint Fadil","نادرة بنت فاضل"], job:["Revisorin des Zollministeriums","مدقّقة وزارة الجمارك"], from:["Bagdad","بغداد"], why:["Überraschungsprüfung","تفتيش مفاجئ"],
  say:["Überraschungsprüfung, Kontrolleur. Ich bin unbestechlich – deshalb reise ich auch ganz allein. Meine beiden Begleiter warten mit den Kisten hinter der Düne, die müssen Sie nicht kontrollieren. Ich habe ihnen gesagt: Wer mit mir reist, braucht keinen Stempel.",
       "تفتيش مفاجئ أيّها المراقب. أنا لا أرتشي، ولهذا أسافر وحدي تمامًا. مرافقاي ينتظران بالصناديق خلف الكثيب، ولا داعي لتفتيشهما. قلت لهما: من يسافر معي لا يحتاج إلى ختم."],
  f:{ seal:[-1,"Ministeriumssiegel, echt, mit Goldrand.","ختم الوزارة، أصليّ، بحافّة ذهبيّة."],
      wealth:[-1,"250 Dinar. Korrekt.","250 دينار. صحيح."],
      papers:[-1,"Register: Revisorin des Ministeriums. Prüfauftrag gültig.","السجلّ: مدقّقة في الوزارة، وأمر التفتيش ساري المفعول."],
      cargo:[0,"Sie selbst trägt nur eine Mappe. Die Kisten „hinter der Düne“ sind nicht hier – und damit auch nicht prüfbar.","لا تحمل إلّا حافظة أوراق. أمّا الصناديق «خلف الكثيب» فليست هنا، ولا يمكن تفتيشها."] },
  truth:["Wer „ganz allein“ reist, hat keine zwei Begleiter mit Kisten hinter der Düne. Nadira nutzte ihren Rang, um Schmuggelware an der Kontrolle vorbeizuschleusen.",
         "من يسافر «وحده تمامًا» لا يكون له مرافقان بصناديق خلف الكثيب. استغلّت نادرة رتبتها لتمرير بضائع مهرَّبة من نقطة التفتيش."] },

{ id:"t38", type:"boss", tier:5, g:"m", p:"dwarf", look:{head:"cap"}, money:600,
  name:["Sakhr ibn Jundub","صخر بن جندب"], job:["Kommandant der Grenzgarnison","قائد حامية الحدود"], from:["Qasr ar-Rimal","قصر الرمال"], why:["Inspektion des Postens","تفقّد النقطة"],
  say:["Ich komme, um diesen Posten zu inspizieren. Ich war noch nie hier, ich kenne diesen Ort nicht. Übrigens: Ihre Neonröhre flackert immer noch, genau wie letzten Monat. Und mein Tee – wie immer, zwei Stück Zucker.",
       "جئت لأتفقّد هذه النقطة. لم آتِ إلى هنا قطّ ولا أعرف المكان. على فكرة، ما زال مصباح النيون عندك يرمش، تمامًا كالشهر الماضي. وشايي كالعادة: بقطعتي سكّر."],
  f:{ seal:[-1,"Garnisonssiegel, echt, frisch poliert.","ختم الحامية، أصليّ، ملمَّع حديثًا."],
      wealth:[-1,"600 Dinar. Kommandantensold. Passt.","600 دينار، راتب قائد. مطابق."],
      papers:[-1,"Register: Kommandant, Inspektionsreise genehmigt. Tadellos.","السجلّ: قائد الحامية، وجولة التفتيش معتمدة. لا غبار عليها."],
      cargo:[0,"Ein Säbel mit Rang-Gravur und ein leerer Beutel – für etwas, das er abholen will?","سيف محفور عليه رتبته، وكيس فارغ… لشيء ينوي أخذه؟"] },
  truth:["Wer nie hier war, weiß nicht, dass die Neonröhre „immer noch“ flackert, und bestellt den Tee nicht „wie immer“. Sakhr kommt jeden Monat – um seinen Anteil am Schmuggel abzuholen.",
         "من لم يأتِ قطّ لا يعرف أنّ النيون «ما زال» يرمش، ولا يطلب الشاي «كالعادة». صخر يأتي كلّ شهر ليقبض حصّته من التهريب."] },

{ id:"t39", type:"clean", tier:5, g:"m", p:"gobold", look:{head:"tarboosh"}, money:20,
  name:["Habhab al-Rahhal","هبهاب الرحّال"], job:["Geschichtenerzähler","حكواتي"], from:["Suq al-Qamar","سوق القمر"], why:["Erzählabend","ليلة حكايات"],
  say:["Ich bin Geschichtenerzähler. Ich habe einen Löwen mit bloßen Händen besiegt, den Mond verkauft und dreimal geheiratet – an einem Tag. Nichts davon ist wahr, das ist mein Beruf. Zwanzig Dinar. Und ja, die Truhe ist voller Köpfe. Puppenköpfe. Für das Schattenspiel.",
       "أنا حكواتي. صرعتُ أسدًا بيديّ العاريتين، وبعت القمر، وتزوّجت ثلاث مرّات في يوم واحد. لا شيء من ذلك صحيح، فتلك مهنتي. معي عشرون دينارًا. ونعم، الصندوق مليء بالرؤوس… رؤوس دمى، لخيال الظلّ."],
  f:{ seal:[-1,"Echt. Am Rand ein gemalter Löwe – er sieht besiegt aus.","أصليّ، وعلى حافّته أسد مرسوم يبدو مهزومًا."],
      wealth:[-1,"20 Dinar. Diesmal die Wahrheit.","20 دينار. هذه المرّة الحقيقة."],
      papers:[-1,"Register: Hakawati, zugelassen für die Kaffeehäuser in ganz Al-Ghubar.","السجلّ: حكواتي، مرخَّص له في مقاهي الغبار كلّها."],
      cargo:[0,"Eine Truhe mit Puppenköpfen aus Leder und eine Lampe für das Schattenspiel.","صندوق فيه رؤوس دمى جلديّة وسراج لخيال الظلّ."] },
  truth:["Ein Lügner von Beruf, der seine Lügen ankündigt, ist ehrlicher als mancher Beamte. Habhab war sauber – die Köpfe gehören Puppen.",
         "كذّاب محترف يعلن أكاذيبه أصدق من بعض الموظّفين. هبهاب نظيف، والرؤوس للدمى."] },

{ id:"t40", type:"bribe", tier:5, g:"m", p:"human", look:{head:"keffiyeh"}, money:5000,
  name:["Mu'taz al-Simsar","معتزّ السمسار"], job:["Makler","سمسار"], from:["Basra","البصرة"], why:["Landkauf","شراء أرض"],
  say:["Ich habe fünftausend Dinar angegeben, alles ehrlich. Ich kaufe Land in Al-Ghubar – Sand, sehr viel Sand. Mein Pass ist neu, meine Papiere sind neu, mein Kamel ist neu. Und es gibt eine kleine Grenzgebühr, nicht wahr? Ich zahle sie gern direkt an Sie. Ohne Quittung, das spart Papier.",
       "صرّحت بخمسة آلاف دينار، وكلّها بأمانة. سأشتري أرضًا في الغبار: رملًا، رملًا كثيرًا. جوازي جديد، وأوراقي جديدة، وجملي جديد. وهناك رسم حدوديّ صغير، أليس كذلك؟ يسعدني أن أدفعه لك مباشرة، بلا إيصال، توفيرًا للورق."],
  f:{ seal:[-1,"Neuer Pass, echtes Siegel.","جواز جديد، بختم أصليّ."],
      wealth:[1,"Angegeben: 5000. Im Sattel eingenäht: weitere 45.000 – in kleinen Bündeln, abgezählt für „Gebühren“.","المصرَّح به: 5000. ومخيط في السرج: 45,000 أخرى، في رزم صغيرة معدودة لـ«الرسوم»."],
      papers:[0,"Register: Makler, alles frisch eingetragen. Neu ist nicht verboten.","السجلّ: سمسار، وكلّ بياناته مسجَّلة حديثًا. الجديد ليس ممنوعًا."],
      cargo:[0,"Ein neuer Sattel, auffällig dick gepolstert.","سرج جديد، محشوّ بسماكة لافتة."] },
  truth:["Neu ist nicht verdächtig, Sand kaufen auch nicht. Aber eine Gebühr „ohne Quittung, direkt an Sie“ ist Bestechung – höflich verpackt.",
         "الجديد ليس مريبًا، وشراء الرمل كذلك. لكنّ «رسمًا بلا إيصال يُدفع لك مباشرة» رشوة في غلاف مهذّب."] },

{ id:"t41", type:"cargo", tier:5, g:"f", p:"dwarf", mood:"nervous", look:{head:"braids"}, money:300,
  name:["Sulafa bint Fulad","سُلافة بنت فولاذ"], job:["Glasbläserin","نافخة زجاج"], from:["Dschabal Nuhas","جبل النحاس"], why:["Teegläser liefern","توصيل استكانات الشاي"],
  say:["Ich liefere Teegläser, dreihundert Stück, für alle Teehäuser in Al-Ghubar. Ich bin nicht nervös, Zwerge zittern immer ein bisschen. Mein Pass hat einen Kratzer, der war schon. Das Klirren? Glas klirrt. Bitte nicht die untere Kiste – die klirrt nicht. Darin ist … Polsterung.",
       "أوصل استكانات الشاي، ثلاثمئة استكان، لكلّ مقاهي الغبار. لست متوتّرة، فالأقزام يرتجفون دائمًا قليلًا. في جوازي خدش كان موجودًا من قبل. القعقعة؟ الزجاج يقعقع. لكن أرجوك ليس الصندوق السفليّ، فهو لا يقعقع. فيه… حشوة."],
  f:{ seal:[0,"Kratzer auf dem Pass, das Siegel unbeschädigt und echt.","خدش على الجواز، والختم سليم وأصليّ."],
      wealth:[-1,"300 Dinar. Passt.","300 دينار. مطابق."],
      papers:[-1,"Register: Glasbläserin, Auftrag der Teehausgilde.","السجلّ: نافخة زجاج، بطلب من نقابة المقاهي."],
      cargo:[1,"In der unteren Kiste: uralte Tontafeln mit Keilschrift, aus den Ruinen geraubt. Unbezahlbar – und verboten.","في الصندوق السفليّ: ألواح طينيّة قديمة بالخطّ المسماريّ، منهوبة من الأطلال. لا تُقدَّر بثمن، وممنوعة."] },
  truth:["Zittern, ein Kratzer und klirrendes Glas sind harmlos. Eine Kiste, die nicht klirren darf, versteckte geraubte Geschichte.",
         "الارتجاف والخدش والزجاج المقعقع لا تضرّ. أمّا صندوق ممنوع عليه أن يقعقع فكان يخفي تاريخًا منهوبًا."] },

{ id:"t42", type:"honest", tier:5, g:"f", p:"giant", fileP:"gobold", mood:"nervous", look:{head:"scarf"}, money:30,
  name:["Sakina Umm Ra'd","سكينة أمّ رعد"], job:["Köchin","طبّاخة"], from:["Jenseits des Salzmeers","ما وراء بحر الملح"], why:["Sohn suchen","البحث عن ابنها"],
  say:["Ich suche meinen Sohn Ra'd. Groß, freundlich, isst zu wenig. Er ist vor ein paar Wochen hier durchgekommen – hoffentlich. Ich habe dreißig Dinar und einen Topf Linsensuppe für ihn. Warum schauen Sie so auf Ihre Akte? Steht da etwas Falsches?",
       "أبحث عن ابني رعد: طويل، لطيف، ولا يأكل كفايته. مرّ من هنا قبل بضعة أسابيع… أرجو ذلك. معي ثلاثون دينارًا وقِدر شوربة عدس له. لماذا تنظر إلى ملفّك هكذا؟ هل فيه خطأ؟"],
  f:{ seal:[-1,"Echt. Ausgestellt jenseits des Salzmeers, hier gegengezeichnet.","أصليّ، صادر وراء بحر الملح ومصدَّق هنا."],
      wealth:[-1,"30 Dinar. Passt.","30 دينار. مطابق."],

   HILFSMITTEL: Zufall (seedbar), Speicher (localStorage, abgesichert), Mathe

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let x = Math.imul(a ^ a >>> 15, 1 | a);
    x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeRng(seed) {
  const f = mulberry32(seed);
  const R = {
    next: f,
    range: (a, b) => a + (b - a) * f(),
    int: (a, b) => a + Math.floor(f() * (b - a + 1)),
    pick: arr => arr[Math.floor(f() * arr.length)],
    chance: p => f() < p,
    shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(f() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
    weighted(obj) { let s = 0; for (const k in obj) s += obj[k]; let x = f() * s; for (const k in obj) { x -= obj[k]; if (x <= 0) return k; } return Object.keys(obj)[0]; }
  };
  return R;
}

      truth = P("g.cargo.t1", { ...V, contra });
    } else if (type === "honest") {
      const kind = r.pick(["money", "from", "why"]);
      if (kind === "money") {
        fileMoney = money * 10; moneyLine = null;
        core = P("g.hon.money.say"); f.wealth = { v: 0, ...P("g.hon.money.f", { ...V, fileMoney: fileMoney }) }; usedTools.push("wealth");
      } else if (kind === "from") {
        let o2; do { o2 = r.pick(W.origin); } while (o2[0] === origin[0]);
        fileFrom = { de: o2[1], ar: o2[2] };
        core = P("g.hon.from.say"); f.papers = { v: 0, ...P("g.hon.from.f", { ...V, fileFrom }) }; usedTools.push("papers");
      } else {
        let p2; do { p2 = r.pick(W.purpose); } while (p2[0] === purpose[0]);
        fileWhy = { de: p2[1], ar: p2[2] };
        core = P("g.hon.why.say"); f.papers = { v: 0, ...P("g.hon.why.f", { ...V, fileWhy }) }; usedTools.push("papers");
      }
      truth = P("g.hon.t1");
    } else if (type === "boss") {
      const c = r.int(1, 4), salary = r.int(2, 6) * 10;
      core = P("g.boss.c" + c, { ...V, salary }); truth = P("g.boss.t" + c + (c === 1 ? "." + g : ""), { ...V, salary });
      f.seal = { v: -1, ...P("g.boss.seal") }; f.wealth = { v: -1, ...P("g.boss.wealth") };
      f.papers = { v: -1, ...P("g.boss.papers") }; f.cargo = { v: 0, ...P("g.boss.cargo") };
      usedTools = ["seal", "wealth", "papers", "cargo"];
    } else {                                         // clean
      core = P("g.clean." + r.int(1, 4)); truth = P("g.clean.t" + r.int(1, 2));
    }

    // --- Harmlose Widersprüche je Stufe ---
    const nHerr = tier <= 1 ? 0 : tier === 2 ? 1 : tier === 3 ? 2 : 3;
    const extra = [];
    let pool = r.shuffle(HERRINGS.slice());
    if (tier >= 3 && type !== "boss") {             // ab Stufe 3: Aussage passt nicht zur Akte
      const prefer = pool.filter(h => h.tool === "papers");
      pool = prefer.concat(pool.filter(h => h.tool !== "papers"));
    }
    for (const h of pool) {
      if (extra.length >= nHerr || type === "boss" && extra.length >= 1) break;
      if (usedTools.includes(h.tool) && type !== "boss") continue;
      if (type === "boss" && h.tool) continue;
      if (h.money && (type === "bribe" || (type === "honest" && fileMoney !== money))) continue;
      if (h.money === "high") { setMoney(r.int(20, 60) * 100); moneyLine = null; }
      if (h.money === "low") { setMoney(r.int(1, 8) * 5); moneyLine = null; }
      usedTools.push(h.tool);
      extra.push(P("g.h." + h.id + ".s"));
      f[h.tool] = { v: 0, ...P("g.h." + h.id + ".f") };
    }
    // unschuldig wirkende Saubere (ab Stufe 4) und gelegentlich nervöse Korrupte (Stufe 5)
    if (tier >= 4 && (isInnocent(type) ? r.chance(.65) : (tier >= 5 && r.chance(.25)))) {
      mood = "nervous"; extra.push(P("g.h.nervous.s"));
      if (isInnocent(type) && r.chance(.5) && moneyLine) { setMoney(r.int(1, 6) * 5); extra.push(P("g.h.poor.s")); }
      if (p !== "human" && r.chance(.6)) extra.push(P("g.h.foreign.s"));
    }
    // Vermögen erst jetzt prüfen, weil Auffälligkeiten den Betrag verändern können
    if (!f.wealth) f.wealth = (money >= 50 && r.chance(.5))
      ? { v: -1, ...P("g.f.wealth.ok2", { ...V, real: money + r.int(-3, 3) * 5 + 5 }) }
      : { v: -1, ...P("g.f.wealth.ok1") };

    // --- Aussage zusammensetzen: Einleitung zuerst, Rest gemischt ---
    const middle = [core].concat(extra);
    if (moneyLine) middle.push(moneyLine);
    const parts = [intro].concat(r.shuffle(middle.filter(Boolean)));

    // --- In L eintragen (beide Sprachen) ---
    const key = fld => "tv." + id + "." + fld;
    const render = (lg, part) => I18N.tl(lg, part.k, part.vars);
    I18N.reg(key("say"), LANGS.map(lg => parts.map(pp => render(lg, pp)).join(" ")));
    I18N.reg(key("truth"), LANGS.map(lg => render(lg, truth)));
    I18N.reg(key("name"), LANGS.map(lg => nameB[lg]));
    I18N.reg(key("job"), LANGS.map(lg => jobB[lg]));
    I18N.reg(key("from"), LANGS.map(lg => fileFrom[lg]));
    I18N.reg(key("why"), LANGS.map(lg => fileWhy[lg]));
    const F = {};
    TOOLS.forEach(tool => { I18N.reg(key("f." + tool), LANGS.map(lg => render(lg, f[tool]))); F[tool] = { v: f[tool].v, k: key("f." + tool) }; });

    return {
      id, type, tier, g, p, fileP: p, money: fileMoney, mood, premade: false, f: F,
      k: { name: key("name"), job: key("job"), from: key("from"), why: key("why"), say: key("say"), truth: key("truth") },
      look: makeLook(p, g, id, type === "boss" ? { boss: true, head: g === "f" ? "scarf" : "cap" } : {}, type)
    };
  }
};

/* ==========================================================================
   AUSSEHEN – prozedurale Parameter für die Canvas-Figuren

const PAL = {

          dwarf: ["#d29b72", "#c4865e", "#b27752", "#dba883"], giant: ["#8f8478", "#7d7469", "#9a8a76", "#6f6a66", "#8a7a6a"] },

  turban: ["#efe9da", "#d9d0bb", "#2b3a5c", "#6b2a2a", "#1c1c1c", "#b9a27a", "#e6dcc6"],
  hood: ["#6b5a44", "#4f4a3e", "#7a4a2a", "#3f4a52", "#5a3f2f"],
  hair: ["#1b1410", "#2b1d14", "#4a3424", "#6a6a6a", "#bdbdbd"],

  sash: ["#8a2a1a", "#2a4a6a", "#c9a24a", "#3a5a2a", "#5a2a4a"],
  capeC: ["#3a2a1c", "#1c1a18", "#5a3a22", "#2a2a33"]

function makeLook(p, g, seedStr, ov, type) {
  const r = makeRng(hashStr(seedStr + "|look"));
  const headOpts = {
    human: { m: ["keffiyeh", "turban", "tarboosh", "skullcap", "none", "keffiyeh"], f: ["scarf"] },
    gobold: { m: ["hood", "tarboosh", "strawhat", "none", "turban"], f: ["scarf", "hood"] },
    dwarf: { m: ["helmet", "turban", "none"], f: ["braids", "scarf"] },
    giant: { m: ["turban", "skullcap", "hood", "none"], f: ["scarf", "hood"] }
  };
  const lk = {
    p, g,
    skin: r.pick(PAL.skin[p]),
    head: r.pick(headOpts[p][g]),
    headC: r.pick(PAL.turban), scarfC: r.pick(PAL.scarf), hoodC: r.pick(PAL.hood),
    kefPat: r.chance(.55) ? "#b3262c" : "#2a2a2a",
    cloth: g === "f" && p === "human" ? r.pick(PAL.abaya.concat(PAL.robe.slice(3))) : r.pick(PAL.robe),
    sash: r.pick(PAL.sash), cape: (g === "m" && r.chance(.35)) || r.chance(.12), capeC: r.pick(PAL.capeC),
    hair: p === "dwarf" ? r.pick(PAL.dwarfHair) : r.pick(PAL.hair),
    eye: r.pick(PAL.eye[p]),
    beard: g === "m" ? (p === "dwarf" ? 3 : p === "gobold" ? r.pick([0, 0, 1]) : r.pick([0, 1, 2, 2, 3])) : 0,
    mustache: g === "m" && p !== "gobold" ? r.pick([0, 1, 1, 2]) : 0,
    bw: r.range(.92, 1.14), dust: r.range(.35, 1), earrings: g === "f" && r.chance(.5),
    seed: hashStr(seedStr), boss: type === "boss", warts: p === "gobold" ? r.int(0, 3) : 0,
    glasses: p === "human" && r.chance(.12)
  };
  Object.assign(lk, ov || {});
  if (lk.boss) { lk.cloth = g === "f" ? "#3a4a3a" : "#4a5a3c"; lk.cape = false; if (g === "m" && p === "human" && ov.mustache === undefined) lk.mustache = 2; }
  // Staubflecken (feste Positionen pro Figur)
  lk.specks = [];
  for (let i = 0; i < 26; i++) lk.specks.push([r.range(-1, 1), r.range(0, 1), r.range(.4, 1.3)]);
  return lk;
